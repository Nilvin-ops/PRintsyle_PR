"Работа бухгалтерии": ["В должности «Главный бухгалтер» по критерию «Работа бухгалтерии» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Задачи распределены, сложные участки имеют контроль и резервирование знаний» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Главный бухгалтер» по критерию «Работа бухгалтерии» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Задачи распределены, сложные участки имеют контроль и резервирование знаний» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Главный бухгалтер» по критерию «Работа бухгалтерии» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Задачи распределены, сложные участки имеют контроль и резервирование знаний» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Главный бухгалтер» по критерию «Работа бухгалтерии» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Задачи распределены, сложные участки имеют контроль и резервирование знаний» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Главный бухгалтер» по критерию «Работа бухгалтерии» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Задачи распределены, сложные участки имеют контроль и резервирование знаний» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Проверки и риски": ["В должности «Главный бухгалтер» по критерию «Проверки и риски» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Документы готовы к запросам, замечания устраняются с проверкой результата» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Главный бухгалтер» по критерию «Проверки и риски» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Документы готовы к запросам, замечания устраняются с проверкой результата» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Главный бухгалтер» по критерию «Проверки и риски» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Документы готовы к запросам, замечания устраняются с проверкой результата» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Главный бухгалтер» по критерию «Проверки и риски» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Документы готовы к запросам, замечания устраняются с проверкой результата» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Главный бухгалтер» по критерию «Проверки и риски» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Документы готовы к запросам, замечания устраняются с проверкой результата» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Инженерная подготовка": ["В должности «Директор технический» по критерию «Инженерная подготовка» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Технологические и технические решения проверены до внедрения в поток» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор технический» по критерию «Инженерная подготовка» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Технологические и технические решения проверены до внедрения в поток» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор технический» по критерию «Инженерная подготовка» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Технологические и технические решения проверены до внедрения в поток» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор технический» по критерию «Инженерная подготовка» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Технологические и технические решения проверены до внедрения в поток» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор технический» по критерию «Инженерная подготовка» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Технологические и технические решения проверены до внедрения в поток» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Потери и риски": ["В должности «Директор технический» по критерию «Потери и риски» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Причины дефектов и простоев имеют владельца, срок и оценку эффекта» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор технический» по критерию «Потери и риски» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Причины дефектов и простоев имеют владельца, срок и оценку эффекта» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор технический» по критерию «Потери и риски» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Причины дефектов и простоев имеют владельца, срок и оценку эффекта» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор технический» по критерию «Потери и риски» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Причины дефектов и простоев имеют владельца, срок и оценку эффекта» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор технический» по критерию «Потери и риски» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Причины дефектов и простоев имеют владельца, срок и оценку эффекта» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Техническая компетентность": ["В должности «Директор технический» по критерию «Техническая компетентность» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Инструкции и обучение обеспечивают безопасную работу на оборудовании» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор технический» по критерию «Техническая компетентность» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Инструкции и обучение обеспечивают безопасную работу на оборудовании» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор технический» по критерию «Техническая компетентность» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Инструкции и обучение обеспечивают безопасную работу на оборудовании» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор технический» по критерию «Техническая компетентность» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Инструкции и обучение обеспечивают безопасную работу на оборудовании» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор технический» по критерию «Техническая компетентность» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Инструкции и обучение обеспечивают безопасную работу на оборудовании» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Начальник производства": {
"Производственный план": ["В должности «Начальник производства» по критерию «Производственный план» результат не соответствует требованию: не выполняет параметры задания или допускает остановку/брак без своевременной реакции. Индикатор «План смены согласован с приоритетами заказов, ресурсами и сроками отгрузки» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Начальник производства» по критерию «Производственный план» выполняет только часть требований: выполняет типовые операции с подсказками; настройки, контроль или передача информации неполны. Индикатор «План смены согласован с приоритетами заказов, ресурсами и сроками отгрузки» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Начальник производства» по критерию «Производственный план» обеспечивает стандарт: самостоятельно выполняет операцию по техкарте, контролирует параметры и фиксирует результат. Индикатор «План смены согласован с приоритетами заказов, ресурсами и сроками отгрузки» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Начальник производства» по критерию «Производственный план» действует проактивно: предупреждает отклонения, согласует переналадку и сохраняет качество при изменении задания. Индикатор «План смены согласован с приоритетами заказов, ресурсами и сроками отгрузки» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Начальник производства» по критерию «Производственный план» улучшает систему: снижает потери времени и материалов, подтверждая эффект улучшений данными смены. Индикатор «План смены согласован с приоритетами заказов, ресурсами и сроками отгрузки» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Загрузка и задания": ["В должности «Начальник производства» по критерию «Загрузка и задания» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Работа распределена с учётом оборудования, квалификации и готовности материалов» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Начальник производства» по критерию «Загрузка и задания» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Работа распределена с учётом оборудования, квалификации и готовности материалов» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Начальник производства» по критерию «Загрузка и задания» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Работа распределена с учётом оборудования, квалификации и готовности материалов» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Начальник производства» по критерию «Загрузка и задания» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Работа распределена с учётом оборудования, квалификации и готовности материалов» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Начальник производства» по критерию «Загрузка и задания» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Работа распределена с учётом оборудования, квалификации и готовности материалов» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Качество и сроки": ["В должности «Начальник производства» по критерию «Качество и сроки» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Отклонения по заказам выявляются до срыва срока или выпуска брака» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Начальник производства» по критерию «Качество и сроки» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Отклонения по заказам выявляются до срыва срока или выпуска брака» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Начальник производства» по критерию «Качество и сроки» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Отклонения по заказам выявляются до срыва срока или выпуска брака» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Начальник производства» по критерию «Качество и сроки» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Отклонения по заказам выявляются до срыва срока или выпуска брака» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Начальник производства» по критерию «Качество и сроки» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Отклонения по заказам выявляются до срыва срока или выпуска брака» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Безопасность ремонта": ["В должности «Механик» по критерию «Безопасность ремонта» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Оборудование безопасно остановлено, ограждения и допуски соблюдены» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Механик» по критерию «Безопасность ремонта» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Оборудование безопасно остановлено, ограждения и допуски соблюдены» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Механик» по критерию «Безопасность ремонта» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Оборудование безопасно остановлено, ограждения и допуски соблюдены» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Механик» по критерию «Безопасность ремонта» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Оборудование безопасно остановлено, ограждения и допуски соблюдены» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Механик» по критерию «Безопасность ремонта» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Оборудование безопасно остановлено, ограждения и допуски соблюдены» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Оператор по изготовлению форм офсетной печати": {
"Подготовка задания": ["В должности «Оператор по изготовлению форм офсетной печати» по критерию «Подготовка задания» результат не соответствует требованию: не выполняет параметры задания или допускает остановку/брак без своевременной реакции. Индикатор «Файл, формат, комплектность и параметры формы сверены с производственным заданием» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Подготовка задания» выполняет только часть требований: выполняет типовые операции с подсказками; настройки, контроль или передача информации неполны. Индикатор «Файл, формат, комплектность и параметры формы сверены с производственным заданием» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Подготовка задания» обеспечивает стандарт: самостоятельно выполняет операцию по техкарте, контролирует параметры и фиксирует результат. Индикатор «Файл, формат, комплектность и параметры формы сверены с производственным заданием» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Подготовка задания» действует проактивно: предупреждает отклонения, согласует переналадку и сохраняет качество при изменении задания. Индикатор «Файл, формат, комплектность и параметры формы сверены с производственным заданием» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Подготовка задания» улучшает систему: снижает потери времени и материалов, подтверждая эффект улучшений данными смены. Индикатор «Файл, формат, комплектность и параметры формы сверены с производственным заданием» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Работа с оборудованием": ["В должности «Оператор по изготовлению форм офсетной печати» по критерию «Работа с оборудованием» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Режимы и расходные материалы используются по инструкции» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Работа с оборудованием» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Режимы и расходные материалы используются по инструкции» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Работа с оборудованием» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Режимы и расходные материалы используются по инструкции» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Работа с оборудованием» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Режимы и расходные материалы используются по инструкции» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Работа с оборудованием» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Режимы и расходные материалы используются по инструкции» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Маркировка и передача": ["В должности «Оператор по изготовлению форм офсетной печати» по критерию «Маркировка и передача» результат не соответствует требованию: не выполняет параметры задания или допускает остановку/брак без своевременной реакции. Индикатор «Формы идентифицированы по заказу и переданы нужному печатнику вовремя» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Маркировка и передача» выполняет только часть требований: выполняет типовые операции с подсказками; настройки, контроль или передача информации неполны. Индикатор «Формы идентифицированы по заказу и переданы нужному печатнику вовремя» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Маркировка и передача» обеспечивает стандарт: самостоятельно выполняет операцию по техкарте, контролирует параметры и фиксирует результат. Индикатор «Формы идентифицированы по заказу и переданы нужному печатнику вовремя» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Маркировка и передача» действует проактивно: предупреждает отклонения, согласует переналадку и сохраняет качество при изменении задания. Индикатор «Формы идентифицированы по заказу и переданы нужному печатнику вовремя» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Маркировка и передача» улучшает систему: снижает потери времени и материалов, подтверждая эффект улучшений данными смены. Индикатор «Формы идентифицированы по заказу и переданы нужному печатнику вовремя» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Безопасность и химия": ["В должности «Оператор по изготовлению форм офсетной печати» по критерию «Безопасность и химия» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Материалы хранятся и применяются по требованиям безопасности» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Безопасность и химия» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Материалы хранятся и применяются по требованиям безопасности» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Безопасность и химия» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Материалы хранятся и применяются по требованиям безопасности» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Безопасность и химия» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Материалы хранятся и применяются по требованиям безопасности» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Оператор по изготовлению форм офсетной печати» по критерию «Безопасность и химия» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Материалы хранятся и применяются по требованиям безопасности» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Учёт компонентов": ["В должности «Колорист (полиграфическое производство)» по критерию «Учёт компонентов» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Остатки и расход отражены, партии красок и добавок прослеживаются» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Колорист (полиграфическое производство)» по критерию «Учёт компонентов» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Остатки и расход отражены, партии красок и добавок прослеживаются» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Колорист (полиграфическое производство)» по критерию «Учёт компонентов» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Остатки и расход отражены, партии красок и добавок прослеживаются» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Колорист (полиграфическое производство)» по критерию «Учёт компонентов» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Остатки и расход отражены, партии красок и добавок прослеживаются» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Колорист (полиграфическое производство)» по критерию «Учёт компонентов» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Остатки и расход отражены, партии красок и добавок прослеживаются» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Чистота и безопасность": ["В должности «Колорист (полиграфическое производство)» по критерию «Чистота и безопасность» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Ёмкости подписаны, рабочее место чистое, требования обращения с химией соблюдены» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Колорист (полиграфическое производство)» по критерию «Чистота и безопасность» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Ёмкости подписаны, рабочее место чистое, требования обращения с химией соблюдены» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Колорист (полиграфическое производство)» по критерию «Чистота и безопасность» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Ёмкости подписаны, рабочее место чистое, требования обращения с химией соблюдены» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Колорист (полиграфическое производство)» по критерию «Чистота и безопасность» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Ёмкости подписаны, рабочее место чистое, требования обращения с химией соблюдены» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Колорист (полиграфическое производство)» по критерию «Чистота и безопасность» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Ёмкости подписаны, рабочее место чистое, требования обращения с химией соблюдены» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Подготовка материала": ["В должности «Машинист резальных машин (участок флатования)» по критерию «Подготовка материала» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Материал и параметры задания сверены до установки на машину» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Машинист резальных машин (участок флатования)» по критерию «Подготовка материала» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Материал и параметры задания сверены до установки на машину» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Машинист резальных машин (участок флатования)» по критерию «Подготовка материала» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Материал и параметры задания сверены до установки на машину» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Машинист резальных машин (участок флатования)» по критерию «Подготовка материала» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Материал и параметры задания сверены до установки на машину» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Машинист резальных машин (участок флатования)» по критерию «Подготовка материала» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Материал и параметры задания сверены до установки на машину» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Точность флатования": ["В должности «Машинист резальных машин (участок флатования)» по критерию «Точность флатования» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Контрольные замеры подтверждают допуск, дефекты не переходят в тираж» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Машинист резальных машин (участок флатования)» по критерию «Точность флатования» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Контрольные замеры подтверждают допуск, дефекты не переходят в тираж» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Машинист резальных машин (участок флатования)» по критерию «Точность флатования» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Контрольные замеры подтверждают допуск, дефекты не переходят в тираж» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Машинист резальных машин (участок флатования)» по критерию «Точность флатования» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Контрольные замеры подтверждают допуск, дефекты не переходят в тираж» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Машинист резальных машин (участок флатования)» по критерию «Точность флатования» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Контрольные замеры подтверждают допуск, дефекты не переходят в тираж» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Печатник-тиснильщик": {

"Укладчик-упаковщик (бригадир)": {
"Распределение работы": ["В должности «Укладчик-упаковщик (бригадир)» по критерию «Распределение работы» результат не соответствует требованию: не выполняет параметры задания или допускает остановку/брак без своевременной реакции. Индикатор «Каждый сотрудник знает заказ, количество, упаковку и срок выполнения» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Распределение работы» выполняет только часть требований: выполняет типовые операции с подсказками; настройки, контроль или передача информации неполны. Индикатор «Каждый сотрудник знает заказ, количество, упаковку и срок выполнения» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Распределение работы» обеспечивает стандарт: самостоятельно выполняет операцию по техкарте, контролирует параметры и фиксирует результат. Индикатор «Каждый сотрудник знает заказ, количество, упаковку и срок выполнения» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Распределение работы» действует проактивно: предупреждает отклонения, согласует переналадку и сохраняет качество при изменении задания. Индикатор «Каждый сотрудник знает заказ, количество, упаковку и срок выполнения» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Распределение работы» улучшает систему: снижает потери времени и материалов, подтверждая эффект улучшений данными смены. Индикатор «Каждый сотрудник знает заказ, количество, упаковку и срок выполнения» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Комплектность и маркировка": ["В должности «Укладчик-упаковщик (бригадир)» по критерию «Комплектность и маркировка» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Упаковка соответствует заказу, этикетки и сопроводительные данные не перепутаны» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Комплектность и маркировка» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Упаковка соответствует заказу, этикетки и сопроводительные данные не перепутаны» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Комплектность и маркировка» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Упаковка соответствует заказу, этикетки и сопроводительные данные не перепутаны» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Комплектность и маркировка» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Упаковка соответствует заказу, этикетки и сопроводительные данные не перепутаны» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Комплектность и маркировка» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Упаковка соответствует заказу, этикетки и сопроводительные данные не перепутаны» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Работа бригады": ["В должности «Укладчик-упаковщик (бригадир)» по критерию «Работа бригады» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Темп сбалансирован, ошибки разбираются на месте, требования безопасности соблюдаются» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Работа бригады» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Темп сбалансирован, ошибки разбираются на месте, требования безопасности соблюдаются» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Работа бригады» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Темп сбалансирован, ошибки разбираются на месте, требования безопасности соблюдаются» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Работа бригады» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Темп сбалансирован, ошибки разбираются на месте, требования безопасности соблюдаются» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Укладчик-упаковщик (бригадир)» по критерию «Работа бригады» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Темп сбалансирован, ошибки разбираются на месте, требования безопасности соблюдаются» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Отбраковка": ["В должности «Укладчик-упаковщик» по критерию «Отбраковка» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Повреждения, дефекты и пересортица отделяются и передаются ответственному» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Укладчик-упаковщик» по критерию «Отбраковка» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Повреждения, дефекты и пересортица отделяются и передаются ответственному» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Укладчик-упаковщик» по критерию «Отбраковка» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Повреждения, дефекты и пересортица отделяются и передаются ответственному» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Укладчик-упаковщик» по критерию «Отбраковка» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Повреждения, дефекты и пересортица отделяются и передаются ответственному» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Укладчик-упаковщик» по критерию «Отбраковка» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Повреждения, дефекты и пересортица отделяются и передаются ответственному» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Аккуратность работы": ["В должности «Укладчик-упаковщик» по критерию «Аккуратность работы» результат не соответствует требованию: не выполняет параметры задания или допускает остановку/брак без своевременной реакции. Индикатор «Готовая продукция не мнётся, не загрязняется и размещается в установленной зоне» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Укладчик-упаковщик» по критерию «Аккуратность работы» выполняет только часть требований: выполняет типовые операции с подсказками; настройки, контроль или передача информации неполны. Индикатор «Готовая продукция не мнётся, не загрязняется и размещается в установленной зоне» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Укладчик-упаковщик» по критерию «Аккуратность работы» обеспечивает стандарт: самостоятельно выполняет операцию по техкарте, контролирует параметры и фиксирует результат. Индикатор «Готовая продукция не мнётся, не загрязняется и размещается в установленной зоне» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Укладчик-упаковщик» по критерию «Аккуратность работы» действует проактивно: предупреждает отклонения, согласует переналадку и сохраняет качество при изменении задания. Индикатор «Готовая продукция не мнётся, не загрязняется и размещается в установленной зоне» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Укладчик-упаковщик» по критерию «Аккуратность работы» улучшает систему: снижает потери времени и материалов, подтверждая эффект улучшений данными смены. Индикатор «Готовая продукция не мнётся, не загрязняется и размещается в установленной зоне» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Погрузка и разгрузка": ["В должности «Водитель погрузчика» по критерию «Погрузка и разгрузка» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Размещение соответствует указаниям, груз не перегружен и надёжно установлен» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Водитель погрузчика» по критерию «Погрузка и разгрузка» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Размещение соответствует указаниям, груз не перегружен и надёжно установлен» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Водитель погрузчика» по критерию «Погрузка и разгрузка» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Размещение соответствует указаниям, груз не перегружен и надёжно установлен» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Водитель погрузчика» по критерию «Погрузка и разгрузка» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Размещение соответствует указаниям, груз не перегружен и надёжно установлен» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Водитель погрузчика» по критерию «Погрузка и разгрузка» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Размещение соответствует указаниям, груз не перегружен и надёжно установлен» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Сохранность груза": ["В должности «Водитель погрузчика» по критерию «Сохранность груза» результат не соответствует требованию: не выполняет параметры задания или допускает остановку/брак без своевременной реакции. Индикатор «Устойчивость, упаковка и маркировка проверены до перемещения» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Водитель погрузчика» по критерию «Сохранность груза» выполняет только часть требований: выполняет типовые операции с подсказками; настройки, контроль или передача информации неполны. Индикатор «Устойчивость, упаковка и маркировка проверены до перемещения» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Водитель погрузчика» по критерию «Сохранность груза» обеспечивает стандарт: самостоятельно выполняет операцию по техкарте, контролирует параметры и фиксирует результат. Индикатор «Устойчивость, упаковка и маркировка проверены до перемещения» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Водитель погрузчика» по критерию «Сохранность груза» действует проактивно: предупреждает отклонения, согласует переналадку и сохраняет качество при изменении задания. Индикатор «Устойчивость, упаковка и маркировка проверены до перемещения» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Водитель погрузчика» по критерию «Сохранность груза» улучшает систему: снижает потери времени и материалов, подтверждая эффект улучшений данными смены. Индикатор «Устойчивость, упаковка и маркировка проверены до перемещения» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Предсменный осмотр": ["В должности «Водитель погрузчика» по критерию «Предсменный осмотр» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Неисправности тормозов, вил, шин и сигнализации выявляются до эксплуатации» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Водитель погрузчика» по критерию «Предсменный осмотр» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Неисправности тормозов, вил, шин и сигнализации выявляются до эксплуатации» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Водитель погрузчика» по критерию «Предсменный осмотр» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Неисправности тормозов, вил, шин и сигнализации выявляются до эксплуатации» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Водитель погрузчика» по критерию «Предсменный осмотр» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Неисправности тормозов, вил, шин и сигнализации выявляются до эксплуатации» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Водитель погрузчика» по критерию «Предсменный осмотр» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Неисправности тормозов, вил, шин и сигнализации выявляются до эксплуатации» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Безопасность движения": ["В должности «Водитель погрузчика» по критерию «Безопасность движения» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Скорость, маршруты и правила приоритета пешеходов соблюдаются» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Водитель погрузчика» по критерию «Безопасность движения» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Скорость, маршруты и правила приоритета пешеходов соблюдаются» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Водитель погрузчика» по критерию «Безопасность движения» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Скорость, маршруты и правила приоритета пешеходов соблюдаются» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Водитель погрузчика» по критерию «Безопасность движения» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Скорость, маршруты и правила приоритета пешеходов соблюдаются» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Водитель погрузчика» по критерию «Безопасность движения» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Скорость, маршруты и правила приоритета пешеходов соблюдаются» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Журнал и безопасность": ["В должности «Контролер контрольно-пропускного пункта» по критерию «Журнал и безопасность» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Записи полны, пост не оставляется без установленной замены» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Контролер контрольно-пропускного пункта» по критерию «Журнал и безопасность» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Записи полны, пост не оставляется без установленной замены» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Контролер контрольно-пропускного пункта» по критерию «Журнал и безопасность» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Записи полны, пост не оставляется без установленной замены» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Контролер контрольно-пропускного пункта» по критерию «Журнал и безопасность» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Записи полны, пост не оставляется без установленной замены» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Контролер контрольно-пропускного пункта» по критерию «Журнал и безопасность» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Записи полны, пост не оставляется без установленной замены» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Руководитель административно-хозяйственной службы": {
"Организация службы": ["В должности «Руководитель административно-хозяйственной службы» по критерию «Организация службы» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «Заявки распределены по исполнителям и срокам, приоритеты понятны» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Организация службы» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «Заявки распределены по исполнителям и срокам, приоритеты понятны» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Организация службы» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «Заявки распределены по исполнителям и срокам, приоритеты понятны» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Организация службы» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «Заявки распределены по исполнителям и срокам, приоритеты понятны» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Организация службы» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «Заявки распределены по исполнителям и срокам, приоритеты понятны» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Состояние объектов": ["В должности «Руководитель административно-хозяйственной службы» по критерию «Состояние объектов» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Неисправности выявляются до остановки критичных систем» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Состояние объектов» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Неисправности выявляются до остановки критичных систем» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Состояние объектов» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Неисправности выявляются до остановки критичных систем» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Состояние объектов» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Неисправности выявляются до остановки критичных систем» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Состояние объектов» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Неисправности выявляются до остановки критичных систем» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Заявки и закупки": ["В должности «Руководитель административно-хозяйственной службы» по критерию «Заявки и закупки» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «Материалы и услуги заказываются под подтверждённую потребность» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Заявки и закупки» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «Материалы и услуги заказываются под подтверждённую потребность» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Заявки и закупки» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «Материалы и услуги заказываются под подтверждённую потребность» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Заявки и закупки» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «Материалы и услуги заказываются под подтверждённую потребность» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Руководитель административно-хозяйственной службы» по критерию «Заявки и закупки» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «Материалы и услуги заказываются под подтверждённую потребность» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Выдача продукции": ["В должности «Буфетчик» по критерию «Выдача продукции» результат не соответствует требованию: теряет возможность или нарушает договорённость; следующий шаг и последствия не контролируются. Индикатор «Заказ и расчёт выполняются точно, продукция выдаётся в надлежащем состоянии» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Буфетчик» по критерию «Выдача продукции» выполняет только часть требований: обрабатывает отдельные запросы, но квалификация, сроки или фиксация договорённостей неполны. Индикатор «Заказ и расчёт выполняются точно, продукция выдаётся в надлежащем состоянии» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Буфетчик» по критерию «Выдача продукции» обеспечивает стандарт: самостоятельно ведёт задачу по согласованному процессу, фиксирует договорённости и следующий шаг. Индикатор «Заказ и расчёт выполняются точно, продукция выдаётся в надлежащем состоянии» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Буфетчик» по критерию «Выдача продукции» действует проактивно: заранее выявляет риск срыва, согласует решение с заинтересованными сторонами и удерживает результат. Индикатор «Заказ и расчёт выполняются точно, продукция выдаётся в надлежащем состоянии» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Буфетчик» по критерию «Выдача продукции» улучшает систему: повышает конверсию, удержание или предсказуемость за счёт анализа причин и воспроизводимых улучшений. Индикатор «Заказ и расчёт выполняются точно, продукция выдаётся в надлежащем состоянии» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Санитарные требования": ["В должности «Буфетчик» по критерию «Санитарные требования» результат не соответствует требованию: оставляет зону в неудовлетворительном или небезопасном состоянии. Индикатор «Руки, инвентарь и поверхности обрабатываются по установленному режиму» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Буфетчик» по критерию «Санитарные требования» выполняет только часть требований: выполняет основную работу, но пропускает отдельные зоны, сроки или требования. Индикатор «Руки, инвентарь и поверхности обрабатываются по установленному режиму» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Буфетчик» по критерию «Санитарные требования» обеспечивает стандарт: поддерживает установленное состояние зоны по графику и сообщает о неисправностях/нехватке. Индикатор «Руки, инвентарь и поверхности обрабатываются по установленному режиму» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Буфетчик» по критерию «Санитарные требования» действует проактивно: заранее выявляет проблемы и организует устранение без срыва работы подразделения. Индикатор «Руки, инвентарь и поверхности обрабатываются по установленному режиму» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Буфетчик» по критерию «Санитарные требования» улучшает систему: предлагает практичные изменения, снижающие повторные замечания и лишние затраты. Индикатор «Руки, инвентарь и поверхности обрабатываются по установленному режиму» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Сроки и хранение": ["В должности «Буфетчик» по критерию «Сроки и хранение» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Просроченная или неправильно хранившаяся продукция не допускается к продаже» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Буфетчик» по критерию «Сроки и хранение» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Просроченная или неправильно хранившаяся продукция не допускается к продаже» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Буфетчик» по критерию «Сроки и хранение» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Просроченная или неправильно хранившаяся продукция не допускается к продаже» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Буфетчик» по критерию «Сроки и хранение» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Просроченная или неправильно хранившаяся продукция не допускается к продаже» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Буфетчик» по критерию «Сроки и хранение» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Просроченная или неправильно хранившаяся продукция не допускается к продаже» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Остатки и ассортимент": ["В должности «Буфетчик» по критерию «Остатки и ассортимент» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «Остатки сверяются, дефицит и списания фиксируются» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Буфетчик» по критерию «Остатки и ассортимент» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «Остатки сверяются, дефицит и списания фиксируются» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Буфетчик» по критерию «Остатки и ассортимент» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «Остатки сверяются, дефицит и списания фиксируются» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Буфетчик» по критерию «Остатки и ассортимент» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «Остатки сверяются, дефицит и списания фиксируются» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Буфетчик» по критерию «Остатки и ассортимент» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «Остатки сверяются, дефицит и списания фиксируются» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Чистота зоны": ["В должности «Буфетчик» по критерию «Чистота зоны» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Оборудование и торговое место чистые в течение смены и после закрытия» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Буфетчик» по критерию «Чистота зоны» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Оборудование и торговое место чистые в течение смены и после закрытия» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Буфетчик» по критерию «Чистота зоны» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Оборудование и торговое место чистые в течение смены и после закрытия» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Буфетчик» по критерию «Чистота зоны» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Оборудование и торговое место чистые в течение смены и после закрытия» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Буфетчик» по критерию «Чистота зоны» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Оборудование и торговое место чистые в течение смены и после закрытия» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Опасные участки": ["В должности «Дворник» по критерию «Опасные участки» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Повреждения покрытия и иные риски сообщены ответственному» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Дворник» по критерию «Опасные участки» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Повреждения покрытия и иные риски сообщены ответственному» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Дворник» по критерию «Опасные участки» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Повреждения покрытия и иные риски сообщены ответственному» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Дворник» по критерию «Опасные участки» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Повреждения покрытия и иные риски сообщены ответственному» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Дворник» по критерию «Опасные участки» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Повреждения покрытия и иные риски сообщены ответственному» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Инвентарь и реагенты": ["В должности «Дворник» по критерию «Инвентарь и реагенты» результат не соответствует требованию: оставляет зону в неудовлетворительном или небезопасном состоянии. Индикатор «Средства применяются по инструкции и не создают дополнительной опасности» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Дворник» по критерию «Инвентарь и реагенты» выполняет только часть требований: выполняет основную работу, но пропускает отдельные зоны, сроки или требования. Индикатор «Средства применяются по инструкции и не создают дополнительной опасности» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Дворник» по критерию «Инвентарь и реагенты» обеспечивает стандарт: поддерживает установленное состояние зоны по графику и сообщает о неисправностях/нехватке. Индикатор «Средства применяются по инструкции и не создают дополнительной опасности» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Дворник» по критерию «Инвентарь и реагенты» действует проактивно: заранее выявляет проблемы и организует устранение без срыва работы подразделения. Индикатор «Средства применяются по инструкции и не создают дополнительной опасности» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Дворник» по критерию «Инвентарь и реагенты» улучшает систему: предлагает практичные изменения, снижающие повторные замечания и лишние затраты. Индикатор «Средства применяются по инструкции и не создают дополнительной опасности» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Состояние инвентаря": ["В должности «Дворник» по критерию «Состояние инвентаря» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Инвентарь очищен, хранится в отведённом месте, неисправности сообщаются» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Дворник» по критерию «Состояние инвентаря» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Инвентарь очищен, хранится в отведённом месте, неисправности сообщаются» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Дворник» по критерию «Состояние инвентаря» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Инвентарь очищен, хранится в отведённом месте, неисправности сообщаются» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Дворник» по критерию «Состояние инвентаря» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Инвентарь очищен, хранится в отведённом месте, неисправности сообщаются» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Дворник» по критерию «Состояние инвентаря» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Инвентарь очищен, хранится в отведённом месте, неисправности сообщаются» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Техник-электрик": {

"Диагностика и ремонт": ["В должности «Техник-электрик» по критерию «Диагностика и ремонт» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Причина неисправности установлена, после ремонта выполнена проверка» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Техник-электрик» по критерию «Диагностика и ремонт» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Причина неисправности установлена, после ремонта выполнена проверка» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Техник-электрик» по критерию «Диагностика и ремонт» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Причина неисправности установлена, после ремонта выполнена проверка» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Техник-электрик» по критерию «Диагностика и ремонт» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Причина неисправности установлена, после ремонта выполнена проверка» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Техник-электрик» по критерию «Диагностика и ремонт» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Причина неисправности установлена, после ремонта выполнена проверка» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Выполнение заявок": ["В должности «Техник-электрик» по критерию «Выполнение заявок» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Заявка закрыта после подтверждения работоспособности заказчиком или ответственным» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Техник-электрик» по критерию «Выполнение заявок» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Заявка закрыта после подтверждения работоспособности заказчиком или ответственным» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Техник-электрик» по критерию «Выполнение заявок» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Заявка закрыта после подтверждения работоспособности заказчиком или ответственным» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Техник-электрик» по критерию «Выполнение заявок» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Заявка закрыта после подтверждения работоспособности заказчиком или ответственным» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Техник-электрик» по критерию «Выполнение заявок» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Заявка закрыта после подтверждения работоспособности заказчиком или ответственным» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Документирование": ["В должности «Техник-электрик» по критерию «Документирование» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Работы, заменённые элементы и обнаруженные риски отражены в записи» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Техник-электрик» по критерию «Документирование» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Работы, заменённые элементы и обнаруженные риски отражены в записи» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Техник-электрик» по критерию «Документирование» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Работы, заменённые элементы и обнаруженные риски отражены в записи» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Техник-электрик» по критерию «Документирование» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Работы, заменённые элементы и обнаруженные риски отражены в записи» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Техник-электрик» по критерию «Документирование» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Работы, заменённые элементы и обнаруженные риски отражены в записи» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Электробезопасность": ["В должности «Техник-электрик» по критерию «Электробезопасность» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Работы выполняются в пределах квалификации и допуска с необходимыми средствами защиты» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Техник-электрик» по критерию «Электробезопасность» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Работы выполняются в пределах квалификации и допуска с необходимыми средствами защиты» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Техник-электрик» по критерию «Электробезопасность» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Работы выполняются в пределах квалификации и допуска с необходимыми средствами защиты» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Техник-электрик» по критерию «Электробезопасность» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Работы выполняются в пределах квалификации и допуска с необходимыми средствами защиты» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Техник-электрик» по критерию «Электробезопасность» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Работы выполняются в пределах квалификации и допуска с необходимыми средствами защиты» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Выполнение задания": ["В должности «Тракторист» по критерию «Выполнение задания» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Работа выполнена в заданной зоне и объёме без повреждения имущества» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Тракторист» по критерию «Выполнение задания» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Работа выполнена в заданной зоне и объёме без повреждения имущества» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Тракторист» по критерию «Выполнение задания» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Работа выполнена в заданной зоне и объёме без повреждения имущества» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Тракторист» по критерию «Выполнение задания» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Работа выполнена в заданной зоне и объёме без повреждения имущества» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Тракторист» по критерию «Выполнение задания» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Работа выполнена в заданной зоне и объёме без повреждения имущества» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Безопасная эксплуатация": ["В должности «Тракторист» по критерию «Безопасная эксплуатация» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Скорость, дистанция, устойчивость и правила работы с навесным оборудованием соблюдаются» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Тракторист» по критерию «Безопасная эксплуатация» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Скорость, дистанция, устойчивость и правила работы с навесным оборудованием соблюдаются» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Тракторист» по критерию «Безопасная эксплуатация» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Скорость, дистанция, устойчивость и правила работы с навесным оборудованием соблюдаются» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Тракторист» по критерию «Безопасная эксплуатация» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Скорость, дистанция, устойчивость и правила работы с навесным оборудованием соблюдаются» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Тракторист» по критерию «Безопасная эксплуатация» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Скорость, дистанция, устойчивость и правила работы с навесным оборудованием соблюдаются» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Техническое состояние": ["В должности «Тракторист» по критерию «Техническое состояние» результат не соответствует требованию: не замечает существенные отклонения либо выполняет действия, создающие риск поломки. Индикатор «Неисправности и расход топлива сообщаются и фиксируются своевременно» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Тракторист» по критерию «Техническое состояние» выполняет только часть требований: проводит отдельные проверки, но диагностика или фиксация дефекта неполная. Индикатор «Неисправности и расход топлива сообщаются и фиксируются своевременно» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Тракторист» по критерию «Техническое состояние» обеспечивает стандарт: выполняет проверку, обслуживание или ремонт по регламенту и подтверждает результат. Индикатор «Неисправности и расход топлива сообщаются и фиксируются своевременно» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Тракторист» по критерию «Техническое состояние» действует проактивно: выявляет признаки отказа заранее, локализует проблему и согласует безопасное восстановление. Индикатор «Неисправности и расход топлива сообщаются и фиксируются своевременно» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Тракторист» по критерию «Техническое состояние» улучшает систему: снижает повторяемость неисправностей на основе причин, данных и профилактических мер. Индикатор «Неисправности и расход топлива сообщаются и фиксируются своевременно» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Записи и допуски": ["В должности «Тракторист» по критерию «Записи и допуски» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Документы и допуск к управлению действительны, обязательные записи заполнены» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Тракторист» по критерию «Записи и допуски» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Документы и допуск к управлению действительны, обязательные записи заполнены» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Тракторист» по критерию «Записи и допуски» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Документы и допуск к управлению действительны, обязательные записи заполнены» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Тракторист» по критерию «Записи и допуски» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Документы и допуск к управлению действительны, обязательные записи заполнены» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Тракторист» по критерию «Записи и допуски» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Документы и допуск к управлению действительны, обязательные записи заполнены» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]
