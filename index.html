<style>

$("#m").innerHTML=({intro,dash,cat,emp:vEmp,ass,res,analytics,plan,set,cand,cass,cres,cset})[V]()}
function dash(){const dr=S.as.filter(a=>a.status=="draft"),fin=S.as.filter(a=>a.status=="final"),open=S.plans.reduce((n,p)=>n+p.items.filter(i=>!i.done).length,0),noA=S.emps.filter(e=>!S.as.some(a=>a.emp==e.id));
const cov=fin.length?Math.round(fin.reduce((n,a)=>n+calc(a).cov,0)/fin.length):0, due=S.emps.filter(e=>e.prob&&e.pe&&Math.ceil((new Date(e.pe)-new Date())/864e5)<=14), low=fin.filter(a=>calc(a).cov<S.thr),recent=[...fin].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
return`<div class="ruler"></div><h1>Панель управления · ${esc(S.company)}</h1><p class="mut">Краткая сводка по сотрудникам, оценкам и развитию команды. Нажмите на показатель, чтобы перейти к деталям.</p>
<div class="grid"><div class="card" onclick="go('emp')"><div class="big">${S.emps.length}</div><b>Сотрудников</b><div class="mut">${new Set(S.emps.map(e=>e.dept).filter(Boolean)).size} подразделений</div></div><div class="card" onclick="go('ass')"><div class="big">${dr.length}</div><b>Оценок в работе</b><div class="mut">${new Set(dr.map(a=>a.emp)).size} сотрудников</div></div><div class="card" onclick="go('res')"><div class="big">${fin.length}</div><b>Завершённых оценок</b><div class="mut">Средняя полнота: ${cov}%</div></div><div class="card" onclick="go('plan')"><div class="big">${open}</div><b>Открытых действий</b><div class="mut">Планы развития</div></div></div>
<div class="grid"><div class="card"><h3>Покрытие оценкой</h3><div class="big">${S.emps.length?Math.round(S.emps.filter(e=>fin.some(a=>a.emp===e.id)).length/S.emps.length*100):0}%</div><div class="mut">Сотрудники хотя бы с одной завершённой оценкой</div><div class="bar"><i style="width:${S.emps.length?Math.round(S.emps.filter(e=>fin.some(a=>a.emp===e.id)).length/S.emps.length*100):0}%"></i></div></div><div class="card"><h3>Требуют внимания</h3><p>${low.length} оценок с полнотой ниже порога ${S.thr}%</p><p>${due.length} испытательных сроков заканчиваются в ближайшие 14 дней</p><p>${noA.length} сотрудников ещё не оценивались</p></div></div>
<h2>Приоритетные действия</h2>${due.map(e=>{const d=Math.ceil((new Date(e.pe)-new Date())/864e5);return`<div class="card row"><div class="grow"><b>${esc(e.n)}</b><div class="mut">Испытательный срок ${d<0?'уже завершился':`заканчивается через ${d} дн.`}</div></div><button class="btn" onclick="go('ass',{emp:'${e.id}'})">Оценить</button></div>`}).join('')}${dr.map(a=>`<div class="card row"><div class="grow"><b>${esc(emp(a.emp)?.n||'Сотрудник удалён')}</b><div class="mut">Черновик оценки · ${esc(a.profile.pos)}</div></div><button class="btn" onclick="S.cur='${a.id}';go('ass')">Продолжить</button></div>`).join('')}${noA.map(e=>`<div class="card row"><div class="grow"><b>${esc(e.n)}</b><div class="mut">Нет завершённых оценок</div></div><button class="btn" onclick="go('ass',{emp:'${e.id}'})">Начать оценку</button></div>`).join('')}${!due.length&&!dr.length&&!noA.length?'<div class="card mut">Срочных действий нет. Ниже — последние завершённые оценки.</div>':''}
<h2>Последние результаты</h2>${recent.length?recent.map(a=>`<div class="card row"><div class="grow"><b>${esc(emp(a.emp)?.n||'—')}</b><div class="mut">${esc(a.profile.pos)} · ${a.date} · итог ${f1(calc(a).S)} из 5 · полнота ${Math.round(calc(a).cov)}%</div></div><button class="ghost" onclick="go('res',{id:'${a.id}'})">Открыть</button></div>`).join(''):'<div class="card mut">Завершённых оценок пока нет.</div>'}`}

function latestFinalByEmployee(assessments=S.as){
 const latest=new Map();
 assessments.filter(a=>a.status==="final").forEach(a=>{const prev=latest.get(a.emp);const ad=(a.date||"")+"|"+(a.period||"");const pd=prev?((prev.date||"")+"|"+(prev.period||"")):"";if(!prev||ad>pd)latest.set(a.emp,a)});
 return [...latest.values()];
}
function analytics(){
const fin=S.as.filter(a=>a.status==="final"),latest=latestFinalByEmployee(fin),today=new Date();
const depts=[...new Set(S.emps.map(e=>e.dept||"Без подразделения"))].sort((a,b)=>a.localeCompare(b,"ru"));
const byDept=depts.map(d=>{const people=S.emps.filter(e=>(e.dept||"Без подразделения")===d),as=latest.filter(a=>people.some(e=>e.id===a.emp)),lastPeople=new Set(as.map(a=>a.emp));return{d,people:people.length,ass:as.length,coverage:people.length?Math.round(lastPeople.size/people.length*100):0,avg:as.some(a=>calc(a).S!=null)?as.filter(a=>calc(a).S!=null).reduce((n,a)=>n+calc(a).S,0)/as.filter(a=>calc(a).S!=null).length:null,low:as.filter(a=>calc(a).cov<S.thr).length}});
const due=S.emps.filter(e=>e.prob&&e.pe&&!fin.some(a=>a.emp===e.id&&(a.date||"")>=e.pe)).map(e=>({...e,days:Math.ceil((new Date(e.pe)-today)/864e5)})).sort((a,b)=>a.days-b.days);
const low=latest.filter(a=>calc(a).cov<S.thr),noRecent=S.emps.filter(e=>!latest.some(a=>a.emp===e.id));
return `<h1>Аналитика и контроль</h1><p class="mut">Сводка по подразделениям, качеству оценки и контрольным датам. Показатели считаются по данным, сохранённым в этом браузере.</p>
<div class="grid"><div class="card"><div class="big">${fin.length}</div><b>Завершённых оценок</b></div><div class="card"><div class="big">${low.length}</div><b>Оценок ниже порога полноты</b><div class="mut">Порог сейчас: ${S.thr}%</div></div><div class="card"><div class="big">${noRecent.length}</div><b>Без завершённой оценки</b></div><div class="card"><div class="big">${due.filter(e=>e.days<=14).length}</div><b>Испытательные сроки в фокусе</b><div class="mut">Ближайшие 14 дней или просрочены</div></div></div>
<div class="card"><div class="row"><div class="grow"><h2>Сводка по подразделениям</h2><p class="mut">Средний балл показан только при наличии завершённых оценок; сравнивайте с учётом состава должностей и полноты данных.</p></div><button class="btn" onclick="downloadSummary()">Скачать сводный отчёт</button></div><div style="overflow-x:auto"><table><thead><tr><th>Подразделение</th><th>Сотрудников</th><th>Оценено</th><th>Покрытие</th><th>Средний балл</th><th>Неполных оценок</th></tr></thead><tbody>${byDept.map(x=>`<tr><td>${esc(x.d)}</td><td>${x.people}</td><td>${new Set(fin.filter(a=>S.emps.some(e=>e.id===a.emp&&(e.dept||"Без подразделения")===x.d)).map(a=>a.emp)).size}</td><td>${x.coverage}%</td><td>${x.avg==null?'—':f1(x.avg)+'/5'}</td><td>${x.low}</td></tr>`).join("")||'<tr><td colspan="6">Нет данных о сотрудниках</td></tr>'}</tbody></table></div></div>

function downloadSummary(){const allFinal=S.as.filter(a=>a.status==="final"),fin=latestFinalByEmployee(allFinal),depts=[...new Set(S.emps.map(e=>e.dept||"Без подразделения"))].sort((a,b)=>a.localeCompare(b,"ru"));const rows=depts.map(d=>{const people=S.emps.filter(e=>(e.dept||"Без подразделения")===d),as=fin.filter(a=>people.some(e=>e.id===a.emp)),rated=new Set(as.map(a=>a.emp)),latest=people.map(e=>as.filter(a=>a.emp===e.id).sort((x,y)=>(y.date||"").localeCompare(x.date||""))[0]).filter(Boolean),scored=latest.map(a=>calc(a).S).filter(v=>v!=null),avg=scored.length?scored.reduce((n,v)=>n+v,0)/scored.length:null;return `<tr><td>${esc(d)}</td><td>${people.length}</td><td>${rated.size}</td><td>${people.length?Math.round(rated.size/people.length*100):0}%</td><td>${avg==null?'—':f1(avg)+'/5'}</td><td>${latest.filter(a=>calc(a).cov<S.thr).length}</td></tr>`}).join('');const html=`<!doctype html><html lang="ru"><meta charset="utf-8"><title>${esc(S.company)} — сводный отчёт</title><style>body{font:14px Arial;margin:30px;color:#182c35}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd6da;padding:8px;text-align:left}th{background:#eef4f6}</style><h1>${esc(S.company)} — сводный отчёт по оценке компетенций</h1><p>Дата формирования: ${new Date().toLocaleDateString('ru-RU')}</p><p>Завершённых оценок: ${fin.length}. Порог полноты: ${S.thr}%.</p><table><thead><tr><th>Подразделение</th><th>Сотрудников</th><th>Оценено</th><th>Покрытие</th><th>Средний балл</th><th>Неполных оценок</th></tr></thead><tbody>${rows}</tbody></table><p>Средние значения не заменяют анализ должностных требований, полноты данных и рабочих доказательств.</p></html>`;const blob=new Blob([html],{type:'text/html;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='Printstyle_Сводный_отчёт.html';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}

function intro(){const st=[["Каталог","Найдите должность и её профиль компетенций","cat"],["Сотрудники","Добавьте человека и назначьте должность","emp"],["Оценка","Выставьте баллы и запишите основания","ass"],["Результаты","Смотрите профиль, пробелы и динамику","res"],["План развития","Превратите пробелы в действия и сроки","plan"]];
return`<div class="ruler"></div><h1>Оценка по требованиям должности, а не по ощущениям</h1><p style="max-width:62ch">Printstyle помогает оценивать компетенции сотрудников по требованиям должности, фиксировать наблюдаемые результаты и превращать зоны роста в понятный план развития. Инструмент адаптирован для задач печатного производства, продаж и поддержки клиентов.</p><div class="row"><button class="btn" onclick="go('dash')">Открыть панель</button><button class="ghost" onclick="go('ass')">Сразу к оценке</button><button class="ghost" onclick="go('cand')">Оценка кандидатов</button></div>
<h2>Как это работает</h2><div class="grid">${st.map((x,i)=>`<div class="card" onclick="go('${x[2]}')"><h3>${i+1}. ${x[0]}</h3><span class="mut">${x[1]}</span></div>`).join("")}</div>

<h2>Три правила</h2><div class="grid"><div class="card"><h3>Баллу нужно основание</h3>Пример поведения или рабочий показатель. Без него цифра — мнение.</div><div class="card"><h3>Результат ≠ компетенция</h3>План продаж зависит от территории и сезона. Оценивайте навык отдельно от итога.</div><div class="card"><h3>Ширина ≠ глубина</h3>Профилей много, но проверена практикой пока малая часть — остальные помечены «предварительный».</div></div>
<div class="warn">Баллы не вердикт о ценности человека и не основание для увольнения. Прототип хранит данные только в вашем браузере.</div>`}
let E;const nv=()=>(parseFloat(pos(E.id).ver)+.1).toFixed(1);
function editProf(id){const p=pos(id);E={id,comps:p.comps.map(c=>({...c}))};edr()}
function edr(){const t=E.comps.reduce((a,c)=>a+c.w,0);dlg(`<h3>Компетенции: ${esc(pos(E.id).n)}</h3><p class="mut">Сохранение создаст версию модели v${nv()}. Прошлые оценки останутся на своей версии. Описывайте наблюдаемое поведение.</p>${E.comps.map((c,i)=>`<div class="card"><label>Компетенция<input value="${esc(c.n)}" onchange="E.comps[${i}].n=this.value"></label><div class="row"><label class="grow">Вес, %<input type="number" min="1" max="100" value="${c.w}" onchange="E.comps[${i}].w=Math.max(1,Math.min(100,+this.value||1));edr()"></label><label class="grow">Ожидаемый уровень<select onchange="E.comps[${i}].e=+this.value">${[1,2,3,4,5].map(n=>`<option ${n==c.e?"selected":""}>${n}</option>`).join("")}</select></label></div><label>Наблюдаемое поведение<input value="${esc(c.ind)}" onchange="E.comps[${i}].ind=this.value"></label><button class="ghost danger" onclick="E.comps.splice(${i},1);edr()">Убрать</button></div>`).join("")}<p>Сумма весов: <b>${t}%</b> ${t==100?"":'<span class="tag bad">нужно 100%</span>'}</p><div class="row"><button class="ghost" onclick="E.comps.push({n:'',w:10,e:3,ind:''});edr()">Добавить компетенцию</button><button class="ghost" onclick="normW()">Привести веса к 100%</button></div><br><div class="row"><button class="btn" onclick="saveProf()">Сохранить версию</button>${S.ov[E.id]?'<button class="ghost danger" onclick="resetProf()">Вернуть исходный</button>':""}<button class="ghost" onclick="dlg()">Отмена</button></div>`)}
function normW(){const t=E.comps.reduce((a,c)=>a+c.w,0)||1;E.comps.forEach(c=>c.w=Math.max(1,Math.round(c.w*100/t)));E.comps[E.comps.length-1].w+=100-E.comps.reduce((a,c)=>a+c.w,0);edr()}
function saveProf(){const c=E.comps;if(c.length<3)return toast("Нужно не меньше 3 компетенций");if(c.some(x=>!x.n.trim()))return toast("У каждой компетенции должно быть название");if(new Set(c.map(x=>x.n.trim().toLowerCase())).size<c.length)return toast("Названия компетенций не должны повторяться");if(c.reduce((a,x)=>a+x.w,0)!=100)return toast("Сумма весов должна быть 100%");
const cu=S.custom.find(p=>p.id==E.id),v=nv();if(cu){cu.comps=c;cu.ver=v;cu.mod=1}else S.ov[E.id]={comps:c,ver:v,mod:1};save();dlg();render();toast("Версия v"+v+" сохранена")}
function resetProf(){delete S.ov[E.id];save();dlg();render();toast("Исходный профиль возвращён")}

function cat(){const cats=[...new Set(POS.concat(S.custom).map(p=>p.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru"));return`<h1>Каталог должностей</h1><div class="row"><input class="grow" placeholder="Поиск должности" value="${esc(F.q)}" oninput="F.q=this.value;catList()"><select class="grow" onchange="F.cat=this.value;catList()"><option value="">Все категории (${POS.length+S.custom.length} должностей)</option>${cats.map(c=>`<option value="${esc(c)}" ${F.cat==c?"selected":""}>${esc(c)}</option>`).join("")}</select><button class="ghost" onclick="newPos()">Добавить должность</button></div><br><div id="cl" class="grid"></div>${setTimeout(catList)&&""}`}
function catList(){const q=F.q.toLowerCase(),l=POS.concat(S.custom).map(p=>pos(p.id)).filter(p=>(!F.cat||p.cat==F.cat)&&p.n.toLowerCase().includes(q));$("#cl").innerHTML=l.length?l.map(p=>`<div class="card" tabindex="0" onclick="posCard('${p.id}')" onkeydown="if(event.key=='Enter')posCard('${p.id}')"><h3>${esc(p.n)}</h3>${posTags(p)}</div>`).join(""):'<div class="card mut">Ничего не найдено. Измените запрос или добавьте должность.</div>'}
function posCard(id){const p=pos(id);dlg(`<h2>${esc(p.n)}</h2>${posTags(p)} <span class="tag">модель v${p.ver}</span><p>${esc(p.d||"Пользовательская должность.")}</p><p class="mut">${p.st=="deep"?"Проработанный профиль для тестирования; веса — стартовая гипотеза.":p.st=="role"?"Ролевой профиль: обязанности и критерии под должность. Ожидаемые уровни и веса — стартовая гипотеза; согласуйте их с руководителем роли до применения для кадровых решений.":"Предварительный профиль: критерии ещё не проверены на практике."}</p><h3>Обязанности</h3><p>${p.duties.length?p.duties.map(esc).join("; "):"Уточняются при настройке профиля."}</p><h3>Компетенции и ожидаемый уровень</h3><table>${p.comps.map(c=>`<tr><td>${esc(c.n)}<div class="mut">${esc(c.ind)}</div></td><td>${c.w}%</td><td>уровень ${c.e}</td></tr>`).join("")}</table><br><div class="row"><button class="btn" onclick="dlg();go('ass',{pos:'${id}'})">Начать оценку</button><button class="ghost" onclick="dlg();go('cand');candForm('',{pos:'${id}'})">Добавить кандидата на должность</button><button class="ghost" onclick="editProf('${id}')">Редактировать компетенции</button>${S.custom.some(x=>x.id==id)?`<button class="ghost danger" onclick="delPos('${id}')">Удалить должность</button>`:""}<button class="ghost" onclick="dlg()">Закрыть</button></div>`)}
function newPos(){const cats=[...new Set(POS.map(p=>p.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru"));dlg(`<h3>Новая должность</h3><label>Название<input id="pn"></label><label>Категория<select id="pc">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label><label>Описание роли<input id="pd" placeholder="Что делает эта роль"></label><label>Обязанности (по одной в строке)<textarea id="pu" rows="3"></textarea></label><label>Взять компетенции за основу<select id="pb"><option value="">Профиль первой должности категории</option>${posOpts()}</select></label><p class="mut">После сохранения откроется редактор: добавьте свои компетенции и настройте веса.</p><div class="row"><button class="btn" onclick="addPos()">Создать и настроить</button><button class="ghost" onclick="dlg()">Отмена</button></div>`)}
function addPos(){const n=$("#pn").value.trim(),c=$("#pc").value,bv=$("#pb").value;if(!n)return toast("Введите название должности");const b=POS.find(x=>x.cat==c)||POS[0],bp=bv&&pos(bv),du=$("#pu").value.split("\n").map(x=>x.trim()).filter(Boolean),id=uid();
S.custom.push({id,n,cat:c,st:"pre",ver:"0.1",d:$("#pd").value.trim()||"Пользовательская должность",duties:du.length?du:b.duties,comps:bp?bp.comps.map(x=>({...x})):b.comps.map(x=>({...x}))});save();dlg();render();editProf(id)}
function delPos(id){if(S.emps.some(e=>e.pos==id)||S.as.some(a=>a.pos==id))return toast("Должность используется: сначала смените её у сотрудников и удалите оценки");if(confirm("Удалить должность?")){S.custom=S.custom.filter(p=>p.id!=id);save();dlg();render();toast("Удалено")}}
const posOpts=(sel,includeArchived=false)=>{const all=POS.concat(S.custom),cats=[...new Set(all.map(p=>p.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru"));let html=cats.map(c=>`<optgroup label="${esc(c)}">${all.filter(p=>p.cat==c).map(p=>`<option value="${p.id}" ${p.id==sel?"selected":""}>${esc(p.n)}</option>`).join("")}</optgroup>`).join("");if(includeArchived&&sel&&!all.some(p=>p.id==sel)&&LEGACY_POS_NAMES[sel])html+=`<optgroup label="Архивная должность (не назначать новым сотрудникам)"><option value="${sel}" selected>${esc(LEGACY_POS_NAMES[sel].n)} — архив</option></optgroup>`;return html};

"Помощь при приладке":["Не выполняет команды печатника или подаёт инструмент небезопасно.","Выполняет типовые команды, но требует частых повторов и уточнений.","Своевременно подаёт инструмент и расходники по командам печатника.","Предугадывает последовательность стандартных действий, не отвлекая печатника и не нарушая безопасность.","Осваивает дополнительные операции в пределах допуска и помогает обучать новых помощников."],
"Своевременная подача":["Допускает перепутывание, загрязнение или повреждение материала, не сообщает о риске.","Подаёт материал, но не всегда замечает момент замены или условия сохранности.","Вовремя заменяет материал, сохраняет чистоту и целостность рулона.","Заранее отслеживает остаток и готовит замену без остановки процесса, когда это возможно.","Снижает потери материала через улучшение порядка подачи и передачи рулонов."],
"Наблюдение за процессом":["Не сообщает о замятиях, обрывах, загрязнениях и иных заметных отклонениях.","Замечает часть отклонений, но сообщает с задержкой или без точного описания.","Сразу сообщает печатнику об отклонениях и описывает, где и что произошло.","Распознаёт ранние признаки проблем и своевременно предупреждает печатника, не вмешиваясь самовольно.","Помогает выявлять повторяющиеся причины остановок, фиксируя обстоятельства и время."],
"Безопасность и порядок":["Вмешивается в движущиеся узлы или нарушает блокировки и требования безопасности.","Знает основные правила, но нуждается в напоминаниях или оставляет рабочую зону неготовой.","Не вмешивается в опасные узлы, соблюдает блокировки и поддерживает порядок по инструкции.","Останавливает небезопасное действие и немедленно сообщает ответственному о риске.","Поддерживает устойчивую безопасную практику и предлагает устранение повторяющихся опасных условий." ]
},
"Мастер типографии": {
"Распределение работ":["Исполнители не понимают приоритет, тираж, срок или критерий готовности.","Распределяет задания, но часть ограничений и приоритетов приходится уточнять в ходе смены.","До начала работы каждый исполнитель понимает приоритет, тираж, срок и критерий готовности.","Перераспределяет нагрузку при отклонениях, сохраняя приоритет заказов и качество.","Улучшает распределение по данным загрузки, простоев и повторных переналадок."],
"Сменное задание":["Не ведёт надёжный план-факт; причины отклонений неизвестны.","Факт выпуска отражён частично, причины и статус отдельных заказов неясны.","Фиксирует выпуск и причины отклонений по каждому заказу смены.","В течение смены реагирует на отставание и заранее передаёт риски следующему ответственному.","На основе план-факта устраняет повторные причины недовыпуска и повышает предсказуемость смен."],
"Контроль качества":["Допускает продолжение печати при очевидном дефекте без остановки и эскалации.","Реагирует на дефекты, но иногда поздно локализует проблему или неполно фиксирует её.","Останавливает проблемный тираж и эскалирует отклонение до накопления большого брака.","Организует локализацию дефекта, информирование ответственных и проверку возобновления выпуска.","Снижает повторяемость дефектов через анализ причин и контроль выполнения корректирующих мер."],
"Передача смены":["Не передаёт статусы заказов, материалы и нерешённые проблемы.","Передача происходит устно и неполно; следующая смена тратит время на восстановление информации.","Передаёт статусы заказов, остатки материалов и открытые проблемы в понятном виде.","Отдельно отмечает риски по срокам и качеству, подтверждает принятие критичных задач.","Стандартизирует передачу смены так, чтобы снизить потери времени и повторение ошибок."],
"Порядок и безопасность":["Оставляет опасные нарушения или неорганизованную зону без реакции.","Устраняет замечания после напоминания, повторные нарушения не разбирает.","Поддерживает порядок, реагирует на нарушения и не передаёт опасные условия следующей смене.","Проверяет устранение опасных условий и разбирает причины повторных нарушений.","Внедряет профилактические решения и подтверждает их устойчивость проверками." ]
},
"Кладовщик (склад готовой продукции)": {
"Приём продукции":["Принимает продукцию без сверки количества, маркировки, упаковки или документов.","Сверяет основные данные, но отдельные несоответствия фиксирует неполно или поздно.","При приёмке сверяет количество, упаковку, маркировку и документы, расхождения фиксирует.","Выявляет повреждения и несоответствия до размещения и своевременно блокирует спорную партию.","Снижает повторные ошибки приёмки, анализируя причины и улучшая контрольные точки."],
"Размещение и хранение":["Размещает заказы без адреса или нарушает правила сохранности и прослеживаемости.","Размещение в основном верное, но поиск или идентификация партии периодически затруднены.","Размещает по установленным адресам, сохраняет маркировку и прослеживаемость партии.","Поддерживает размещение, позволяющее быстро найти заказ и безопасно выполнить комплектацию.","Предлагает улучшения адресного хранения, сокращающие поиск и риск пересортицы."],
"Комплектация отгрузки":["Комплектует неверный заказ, количество или документы; ошибку не выявляет до передачи.","Проверяет заказ, но отдельные позиции или документы требуют повторной проверки.","Сверяет заказ, количество и комплект документов до передачи на отгрузку.","Выявляет расхождения заранее и предотвращает передачу неполного или чужого заказа.","Снижает ошибки комплектации по данным инцидентов и улучшает контроль перед отгрузкой."],
"Учёт остатков":["Движение продукции не отражается своевременно; остатки систематически расходятся.","Операции отражаются с задержками, расхождения устраняются без установления причины.","Своевременно отражает движение и сообщает о расхождениях с фактическим остатком.","Проверяет причины расхождений и предупреждает повторение ошибок учёта.","Повышает точность учёта через подтверждённые изменения порядка операций."],
"Выдача и отгрузка":["Передаёт груз без проверки получателя, документов или факта передачи.","Проверяет основные документы, но подтверждение передачи или комплектность иногда отсутствуют.","Передаёт груз уполномоченному перевозчику с проверкой и подтверждением документов.","Заранее выявляет риск задержки или несоответствия и согласует исправление до передачи.","Улучшает процесс отгрузки по данным задержек, ошибок и повреждений." ]
},
"Кладовщик (склад материалов)": {
"Приём материалов":["Размещает материал без сверки количества, маркировки, партии или документов.","Сверяет основные позиции, но расхождения или повреждения фиксирует неполно.","До размещения сверяет количество, маркировку, партию и документы.","Изолирует спорный материал и оперативно информирует ответственных до его выдачи.","Снижает ошибки приёмки через анализ повторных расхождений и улучшение контроля."],
"Условия хранения":["Допускает загрязнение, повреждение, смешение партий или нарушение условий хранения.","Соблюдает основные правила, но периодически пропускает маркировку или состояние упаковки.","Защищает материалы от влаги, загрязнения и повреждения, не смешивает партии.","Регулярно выявляет риски хранения и устраняет их до потери пригодности материала.","Улучшает хранение по данным порчи, повреждений и условий на складе."],
"Выдача в производство":["Выдаёт материал без сверки с заявкой или не отражает движение в учёте.","Сверяет заявку, но случаются задержки учёта или неполная идентификация заказа.","Выдаёт материал по заявке и заказу, своевременно фиксирует движение.","Проверяет критичные параметры и заранее сообщает о нехватке или несоответствии.","Снижает ошибки выдачи и ожидание производства, анализируя заявки и возвраты."],
"Партии и остатки":["Не может определить партию или актуальный остаток; риск дефицита не сообщается.","Прослеживаемость есть не по всем позициям, остатки проверяются после возникновения проблемы.","Обеспечивает прослеживаемость партий и сообщает о критических остатках заранее.","Предупреждает риск дефицита с учётом потребности производства и сроков пополнения.","Повышает точность запасов и предотвращает дефицит на основе анализа расхода и отклонений."],
"Возвраты и инвентаризация":["Возвратные материалы возвращаются в запас без проверки; расхождения не оформляются.","Проверка возвратов и инвентаризация выполняются, но причины расхождений остаются неясны.","Проверяет состояние возврата, корректно отражает его и оформляет расхождения инвентаризации.","Разделяет пригодные, спорные и непригодные материалы, организует проверку причин расхождений.","Снижает повторные расхождения через улучшение процедур возврата и инвентаризации." ]
},
"Генеральный директор": {
"Стратегия и цели": ["В должности «Генеральный директор» по критерию «Стратегия и цели» результат не соответствует требованию: не обеспечивает ожидаемый результат по критерию и не фиксирует отклонение. Индикатор «Утверждены приоритеты и измеримые цели; решения согласуются с долгосрочными задачами бизнеса» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Генеральный директор» по критерию «Стратегия и цели» выполняет только часть требований: выполняет часть требований, но нуждается в напоминаниях или повторной проверке. Индикатор «Утверждены приоритеты и измеримые цели; решения согласуются с долгосрочными задачами бизнеса» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Генеральный директор» по критерию «Стратегия и цели» обеспечивает стандарт: самостоятельно выполняет требование индикатора в обычных рабочих условиях. Индикатор «Утверждены приоритеты и измеримые цели; решения согласуются с долгосрочными задачами бизнеса» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Генеральный директор» по критерию «Стратегия и цели» действует проактивно: предупреждает отклонения и корректирует действия без потери качества результата. Индикатор «Утверждены приоритеты и измеримые цели; решения согласуются с долгосрочными задачами бизнеса» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Генеральный директор» по критерию «Стратегия и цели» улучшает систему: устраняет повторяющиеся причины отклонений и подтверждает улучшение фактами. Индикатор «Утверждены приоритеты и измеримые цели; решения согласуются с долгосрочными задачами бизнеса» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Прибыльность бизнеса": ["В должности «Генеральный директор» по критерию «Прибыльность бизнеса» результат не соответствует требованию: допускает существенные ошибки в расчётах или документах, не выявляя их до передачи. Индикатор «Рассматривает выручку, маржинальность, расходы и денежный поток в единой картине» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Генеральный директор» по критерию «Прибыльность бизнеса» выполняет только часть требований: выполняет расчёты и сверки с повторными исправлениями либо задержками. Индикатор «Рассматривает выручку, маржинальность, расходы и денежный поток в единой картине» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Генеральный директор» по критерию «Прибыльность бизнеса» обеспечивает стандарт: готовит проверяемые данные в срок, сверяет источники и объясняет отклонения. Индикатор «Рассматривает выручку, маржинальность, расходы и денежный поток в единой картине» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Генеральный директор» по критерию «Прибыльность бизнеса» действует проактивно: заранее выявляет финансовые риски и предлагает обоснованные варианты действий. Индикатор «Рассматривает выручку, маржинальность, расходы и денежный поток в единой картине» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Генеральный директор» по критерию «Прибыльность бизнеса» улучшает систему: снижает повторные ошибки и повышает качество решений через улучшение контроля и аналитики. Индикатор «Рассматривает выручку, маржинальность, расходы и денежный поток в единой картине» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Руководящая команда": ["В должности «Генеральный директор» по критерию «Руководящая команда» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «У руководителей есть согласованные цели, полномочия и регулярная оценка результата» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Генеральный директор» по критерию «Руководящая команда» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «У руководителей есть согласованные цели, полномочия и регулярная оценка результата» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Генеральный директор» по критерию «Руководящая команда» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «У руководителей есть согласованные цели, полномочия и регулярная оценка результата» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Генеральный директор» по критерию «Руководящая команда» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «У руководителей есть согласованные цели, полномочия и регулярная оценка результата» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Генеральный директор» по критерию «Руководящая команда» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «У руководителей есть согласованные цели, полномочия и регулярная оценка результата» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Ключевые решения": ["В должности «Генеральный директор» по критерию «Ключевые решения» результат не соответствует требованию: не обеспечивает ожидаемый результат по критерию и не фиксирует отклонение. Индикатор «Инвестиции и крупные обязательства обоснованы данными, рисками и ожидаемым эффектом» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Генеральный директор» по критерию «Ключевые решения» выполняет только часть требований: выполняет часть требований, но нуждается в напоминаниях или повторной проверке. Индикатор «Инвестиции и крупные обязательства обоснованы данными, рисками и ожидаемым эффектом» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Генеральный директор» по критерию «Ключевые решения» обеспечивает стандарт: самостоятельно выполняет требование индикатора в обычных рабочих условиях. Индикатор «Инвестиции и крупные обязательства обоснованы данными, рисками и ожидаемым эффектом» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Генеральный директор» по критерию «Ключевые решения» действует проактивно: предупреждает отклонения и корректирует действия без потери качества результата. Индикатор «Инвестиции и крупные обязательства обоснованы данными, рисками и ожидаемым эффектом» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Генеральный директор» по критерию «Ключевые решения» улучшает систему: устраняет повторяющиеся причины отклонений и подтверждает улучшение фактами. Индикатор «Инвестиции и крупные обязательства обоснованы данными, рисками и ожидаемым эффектом» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Управление рисками": ["В должности «Генеральный директор» по критерию «Управление рисками» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Критические риски имеют владельцев, меры реагирования и контроль исполнения» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Генеральный директор» по критерию «Управление рисками» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Критические риски имеют владельцев, меры реагирования и контроль исполнения» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Генеральный директор» по критерию «Управление рисками» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Критические риски имеют владельцев, меры реагирования и контроль исполнения» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Генеральный директор» по критерию «Управление рисками» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Критические риски имеют владельцев, меры реагирования и контроль исполнения» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Генеральный директор» по критерию «Управление рисками» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Критические риски имеют владельцев, меры реагирования и контроль исполнения» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]
},
"Директор финансовый": {
"Бюджет и прогноз": ["В должности «Директор финансовый» по критерию «Бюджет и прогноз» результат не соответствует требованию: не выполняет параметры задания или допускает остановку/брак без своевременной реакции. Индикатор «План-факт анализ своевременно показывает причины и финансовый эффект отклонений» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор финансовый» по критерию «Бюджет и прогноз» выполняет только часть требований: выполняет типовые операции с подсказками; настройки, контроль или передача информации неполны. Индикатор «План-факт анализ своевременно показывает причины и финансовый эффект отклонений» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор финансовый» по критерию «Бюджет и прогноз» обеспечивает стандарт: самостоятельно выполняет операцию по техкарте, контролирует параметры и фиксирует результат. Индикатор «План-факт анализ своевременно показывает причины и финансовый эффект отклонений» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор финансовый» по критерию «Бюджет и прогноз» действует проактивно: предупреждает отклонения, согласует переналадку и сохраняет качество при изменении задания. Индикатор «План-факт анализ своевременно показывает причины и финансовый эффект отклонений» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор финансовый» по критерию «Бюджет и прогноз» улучшает систему: снижает потери времени и материалов, подтверждая эффект улучшений данными смены. Индикатор «План-факт анализ своевременно показывает причины и финансовый эффект отклонений» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Ликвидность и платежи": ["В должности «Директор финансовый» по критерию «Ликвидность и платежи» результат не соответствует требованию: допускает существенные ошибки в расчётах или документах, не выявляя их до передачи. Индикатор «Платёжный календарь выявляет риск кассового разрыва заранее» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор финансовый» по критерию «Ликвидность и платежи» выполняет только часть требований: выполняет расчёты и сверки с повторными исправлениями либо задержками. Индикатор «Платёжный календарь выявляет риск кассового разрыва заранее» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор финансовый» по критерию «Ликвидность и платежи» обеспечивает стандарт: готовит проверяемые данные в срок, сверяет источники и объясняет отклонения. Индикатор «Платёжный календарь выявляет риск кассового разрыва заранее» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор финансовый» по критерию «Ликвидность и платежи» действует проактивно: заранее выявляет финансовые риски и предлагает обоснованные варианты действий. Индикатор «Платёжный календарь выявляет риск кассового разрыва заранее» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор финансовый» по критерию «Ликвидность и платежи» улучшает систему: снижает повторные ошибки и повышает качество решений через улучшение контроля и аналитики. Индикатор «Платёжный календарь выявляет риск кассового разрыва заранее» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Управленческая отчётность": ["В должности «Директор финансовый» по критерию «Управленческая отчётность» результат не соответствует требованию: допускает существенные ошибки в расчётах или документах, не выявляя их до передачи. Индикатор «Руководство получает согласованные цифры в установленный срок» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор финансовый» по критерию «Управленческая отчётность» выполняет только часть требований: выполняет расчёты и сверки с повторными исправлениями либо задержками. Индикатор «Руководство получает согласованные цифры в установленный срок» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор финансовый» по критерию «Управленческая отчётность» обеспечивает стандарт: готовит проверяемые данные в срок, сверяет источники и объясняет отклонения. Индикатор «Руководство получает согласованные цифры в установленный срок» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор финансовый» по критерию «Управленческая отчётность» действует проактивно: заранее выявляет финансовые риски и предлагает обоснованные варианты действий. Индикатор «Руководство получает согласованные цифры в установленный срок» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор финансовый» по критерию «Управленческая отчётность» улучшает систему: снижает повторные ошибки и повышает качество решений через улучшение контроля и аналитики. Индикатор «Руководство получает согласованные цифры в установленный срок» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Директор исполнительный": {

"Координация подразделений": ["В должности «Директор исполнительный» по критерию «Координация подразделений» результат не соответствует требованию: не обеспечивает ожидаемый результат по критерию и не фиксирует отклонение. Индикатор «Конфликты приоритетов разрешаются, задачи между отделами не теряются» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор исполнительный» по критерию «Координация подразделений» выполняет только часть требований: выполняет часть требований, но нуждается в напоминаниях или повторной проверке. Индикатор «Конфликты приоритетов разрешаются, задачи между отделами не теряются» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор исполнительный» по критерию «Координация подразделений» обеспечивает стандарт: самостоятельно выполняет требование индикатора в обычных рабочих условиях. Индикатор «Конфликты приоритетов разрешаются, задачи между отделами не теряются» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор исполнительный» по критерию «Координация подразделений» действует проактивно: предупреждает отклонения и корректирует действия без потери качества результата. Индикатор «Конфликты приоритетов разрешаются, задачи между отделами не теряются» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор исполнительный» по критерию «Координация подразделений» улучшает систему: устраняет повторяющиеся причины отклонений и подтверждает улучшение фактами. Индикатор «Конфликты приоритетов разрешаются, задачи между отделами не теряются» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Контроль решений": ["В должности «Директор исполнительный» по критерию «Контроль решений» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Договорённости фиксируются и проверяются до закрытия» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор исполнительный» по критерию «Контроль решений» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Договорённости фиксируются и проверяются до закрытия» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор исполнительный» по критерию «Контроль решений» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Договорённости фиксируются и проверяются до закрытия» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор исполнительный» по критерию «Контроль решений» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Договорённости фиксируются и проверяются до закрытия» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор исполнительный» по критерию «Контроль решений» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Договорённости фиксируются и проверяются до закрытия» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Операционные препятствия": ["В должности «Директор исполнительный» по критерию «Операционные препятствия» результат не соответствует требованию: не обеспечивает ожидаемый результат по критерию и не фиксирует отклонение. Индикатор «Повторяющиеся сбои устраняются через причины, а не разовые напоминания» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор исполнительный» по критерию «Операционные препятствия» выполняет только часть требований: выполняет часть требований, но нуждается в напоминаниях или повторной проверке. Индикатор «Повторяющиеся сбои устраняются через причины, а не разовые напоминания» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор исполнительный» по критерию «Операционные препятствия» обеспечивает стандарт: самостоятельно выполняет требование индикатора в обычных рабочих условиях. Индикатор «Повторяющиеся сбои устраняются через причины, а не разовые напоминания» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор исполнительный» по критерию «Операционные препятствия» действует проактивно: предупреждает отклонения и корректирует действия без потери качества результата. Индикатор «Повторяющиеся сбои устраняются через причины, а не разовые напоминания» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор исполнительный» по критерию «Операционные препятствия» улучшает систему: устраняет повторяющиеся причины отклонений и подтверждает улучшение фактами. Индикатор «Повторяющиеся сбои устраняются через причины, а не разовые напоминания» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"План-факт и риски": ["В должности «Директор исполнительный» по критерию «План-факт и риски» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Отклонения выявляются своевременно и сопровождаются планом действий» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор исполнительный» по критерию «План-факт и риски» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Отклонения выявляются своевременно и сопровождаются планом действий» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор исполнительный» по критерию «План-факт и риски» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Отклонения выявляются своевременно и сопровождаются планом действий» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор исполнительный» по критерию «План-факт и риски» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Отклонения выявляются своевременно и сопровождаются планом действий» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор исполнительный» по критерию «План-факт и риски» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Отклонения выявляются своевременно и сопровождаются планом действий» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Секретарь - референт": {
"Календарь и встречи": ["В должности «Секретарь - референт» по критерию «Календарь и встречи» результат не соответствует требованию: пропускает обязательный этап или передаёт документ с критичными ошибками. Индикатор «Нет накладок; участники заранее получают время, место и повестку» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Секретарь - референт» по критерию «Календарь и встречи» выполняет только часть требований: оформляет типовые документы, но нуждается в перепроверке полноты или сроков. Индикатор «Нет накладок; участники заранее получают время, место и повестку» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Секретарь - референт» по критерию «Календарь и встречи» обеспечивает стандарт: самостоятельно готовит корректный комплект и соблюдает установленный срок процедуры. Индикатор «Нет накладок; участники заранее получают время, место и повестку» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Секретарь - референт» по критерию «Календарь и встречи» действует проактивно: заранее выявляет правовые/процедурные риски и согласует исправления до последствий. Индикатор «Нет накладок; участники заранее получают время, место и повестку» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Секретарь - референт» по критерию «Календарь и встречи» улучшает систему: предупреждает повторные ошибки через стандарты, контрольные точки и актуализацию шаблонов. Индикатор «Нет накладок; участники заранее получают время, место и повестку» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Подготовка материалов": ["В должности «Секретарь - референт» по критерию «Подготовка материалов» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «Документы проверены на полноту, актуальность и ошибки до передачи» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Секретарь - референт» по критерию «Подготовка материалов» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «Документы проверены на полноту, актуальность и ошибки до передачи» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Секретарь - референт» по критерию «Подготовка материалов» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «Документы проверены на полноту, актуальность и ошибки до передачи» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Секретарь - референт» по критерию «Подготовка материалов» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «Документы проверены на полноту, актуальность и ошибки до передачи» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Секретарь - референт» по критерию «Подготовка материалов» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «Документы проверены на полноту, актуальность и ошибки до передачи» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Маршрутизация запросов": ["В должности «Секретарь - референт» по критерию «Маршрутизация запросов» результат не соответствует требованию: не обеспечивает ожидаемый результат по критерию и не фиксирует отклонение. Индикатор «Запросы направлены нужному ответственному без потери контекста» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Секретарь - референт» по критерию «Маршрутизация запросов» выполняет только часть требований: выполняет часть требований, но нуждается в напоминаниях или повторной проверке. Индикатор «Запросы направлены нужному ответственному без потери контекста» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Секретарь - референт» по критерию «Маршрутизация запросов» обеспечивает стандарт: самостоятельно выполняет требование индикатора в обычных рабочих условиях. Индикатор «Запросы направлены нужному ответственному без потери контекста» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Секретарь - референт» по критерию «Маршрутизация запросов» действует проактивно: предупреждает отклонения и корректирует действия без потери качества результата. Индикатор «Запросы направлены нужному ответственному без потери контекста» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Секретарь - референт» по критерию «Маршрутизация запросов» улучшает систему: устраняет повторяющиеся причины отклонений и подтверждает улучшение фактами. Индикатор «Запросы направлены нужному ответственному без потери контекста» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Поручения и сроки": ["В должности «Секретарь - референт» по критерию «Поручения и сроки» результат не соответствует требованию: пропускает обязательный этап или передаёт документ с критичными ошибками. Индикатор «Статус поручений актуален, о риске просрочки сообщается заранее» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Секретарь - референт» по критерию «Поручения и сроки» выполняет только часть требований: оформляет типовые документы, но нуждается в перепроверке полноты или сроков. Индикатор «Статус поручений актуален, о риске просрочки сообщается заранее» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Секретарь - референт» по критерию «Поручения и сроки» обеспечивает стандарт: самостоятельно готовит корректный комплект и соблюдает установленный срок процедуры. Индикатор «Статус поручений актуален, о риске просрочки сообщается заранее» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Секретарь - референт» по критерию «Поручения и сроки» действует проактивно: заранее выявляет правовые/процедурные риски и согласует исправления до последствий. Индикатор «Статус поручений актуален, о риске просрочки сообщается заранее» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Секретарь - референт» по критерию «Поручения и сроки» улучшает систему: предупреждает повторные ошибки через стандарты, контрольные точки и актуализацию шаблонов. Индикатор «Статус поручений актуален, о риске просрочки сообщается заранее» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Специалист по кадрам": {
"Кадровое оформление": ["В должности «Специалист по кадрам» по критерию «Кадровое оформление» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Документы подготовлены корректно и в установленные законом сроки» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Специалист по кадрам» по критерию «Кадровое оформление» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Документы подготовлены корректно и в установленные законом сроки» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Специалист по кадрам» по критерию «Кадровое оформление» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Документы подготовлены корректно и в установленные законом сроки» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Специалист по кадрам» по критерию «Кадровое оформление» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Документы подготовлены корректно и в установленные законом сроки» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Специалист по кадрам» по критерию «Кадровое оформление» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Документы подготовлены корректно и в установленные законом сроки» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Личные дела и учёт": ["В должности «Специалист по кадрам» по критерию «Личные дела и учёт» результат не соответствует требованию: допускает существенные ошибки в расчётах или документах, не выявляя их до передачи. Индикатор «Данные и документы полны, актуальны и доступны по установленным правилам» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Специалист по кадрам» по критерию «Личные дела и учёт» выполняет только часть требований: выполняет расчёты и сверки с повторными исправлениями либо задержками. Индикатор «Данные и документы полны, актуальны и доступны по установленным правилам» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Специалист по кадрам» по критерию «Личные дела и учёт» обеспечивает стандарт: готовит проверяемые данные в срок, сверяет источники и объясняет отклонения. Индикатор «Данные и документы полны, актуальны и доступны по установленным правилам» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Специалист по кадрам» по критерию «Личные дела и учёт» действует проактивно: заранее выявляет финансовые риски и предлагает обоснованные варианты действий. Индикатор «Данные и документы полны, актуальны и доступны по установленным правилам» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Специалист по кадрам» по критерию «Личные дела и учёт» улучшает систему: снижает повторные ошибки и повышает качество решений через улучшение контроля и аналитики. Индикатор «Данные и документы полны, актуальны и доступны по установленным правилам» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Сроки процедур": ["В должности «Специалист по кадрам» по критерию «Сроки процедур» результат не соответствует требованию: пропускает обязательный этап или передаёт документ с критичными ошибками. Индикатор «Кадровые события не пропускаются, ответственные уведомлены своевременно» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Специалист по кадрам» по критерию «Сроки процедур» выполняет только часть требований: оформляет типовые документы, но нуждается в перепроверке полноты или сроков. Индикатор «Кадровые события не пропускаются, ответственные уведомлены своевременно» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Специалист по кадрам» по критерию «Сроки процедур» обеспечивает стандарт: самостоятельно готовит корректный комплект и соблюдает установленный срок процедуры. Индикатор «Кадровые события не пропускаются, ответственные уведомлены своевременно» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Специалист по кадрам» по критерию «Сроки процедур» действует проактивно: заранее выявляет правовые/процедурные риски и согласует исправления до последствий. Индикатор «Кадровые события не пропускаются, ответственные уведомлены своевременно» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Специалист по кадрам» по критерию «Сроки процедур» улучшает систему: предупреждает повторные ошибки через стандарты, контрольные точки и актуализацию шаблонов. Индикатор «Кадровые события не пропускаются, ответственные уведомлены своевременно» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Справки и ответы": ["В должности «Специалист по кадрам» по критерию «Справки и ответы» результат не соответствует требованию: пропускает обязательный этап или передаёт документ с критичными ошибками. Индикатор «Сведения сверены с первичными документами и выданы адресату в срок» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Специалист по кадрам» по критерию «Справки и ответы» выполняет только часть требований: оформляет типовые документы, но нуждается в перепроверке полноты или сроков. Индикатор «Сведения сверены с первичными документами и выданы адресату в срок» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Специалист по кадрам» по критерию «Справки и ответы» обеспечивает стандарт: самостоятельно готовит корректный комплект и соблюдает установленный срок процедуры. Индикатор «Сведения сверены с первичными документами и выданы адресату в срок» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Специалист по кадрам» по критерию «Справки и ответы» действует проактивно: заранее выявляет правовые/процедурные риски и согласует исправления до последствий. Индикатор «Сведения сверены с первичными документами и выданы адресату в срок» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Специалист по кадрам» по критерию «Справки и ответы» улучшает систему: предупреждает повторные ошибки через стандарты, контрольные точки и актуализацию шаблонов. Индикатор «Сведения сверены с первичными документами и выданы адресату в срок» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Персональные данные": ["В должности «Специалист по кадрам» по критерию «Персональные данные» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Доступ и передача кадровых сведений соответствуют полномочиям» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Специалист по кадрам» по критерию «Персональные данные» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Доступ и передача кадровых сведений соответствуют полномочиям» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Специалист по кадрам» по критерию «Персональные данные» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Доступ и передача кадровых сведений соответствуют полномочиям» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Специалист по кадрам» по критерию «Персональные данные» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Доступ и передача кадровых сведений соответствуют полномочиям» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Специалист по кадрам» по критерию «Персональные данные» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Доступ и передача кадровых сведений соответствуют полномочиям» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Экономист": {
"Расчёт себестоимости": ["В должности «Экономист» по критерию «Расчёт себестоимости» результат не соответствует требованию: допускает существенные ошибки в расчётах или документах, не выявляя их до передачи. Индикатор «Методика и исходные данные прозрачны, расчёт можно перепроверить» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Экономист» по критерию «Расчёт себестоимости» выполняет только часть требований: выполняет расчёты и сверки с повторными исправлениями либо задержками. Индикатор «Методика и исходные данные прозрачны, расчёт можно перепроверить» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Экономист» по критерию «Расчёт себестоимости» обеспечивает стандарт: готовит проверяемые данные в срок, сверяет источники и объясняет отклонения. Индикатор «Методика и исходные данные прозрачны, расчёт можно перепроверить» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Экономист» по критерию «Расчёт себестоимости» действует проактивно: заранее выявляет финансовые риски и предлагает обоснованные варианты действий. Индикатор «Методика и исходные данные прозрачны, расчёт можно перепроверить» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Экономист» по критерию «Расчёт себестоимости» улучшает систему: снижает повторные ошибки и повышает качество решений через улучшение контроля и аналитики. Индикатор «Методика и исходные данные прозрачны, расчёт можно перепроверить» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"План-факт анализ": ["В должности «Экономист» по критерию «План-факт анализ» результат не соответствует требованию: не выполняет параметры задания или допускает остановку/брак без своевременной реакции. Индикатор «Отклонения разбиты по причинам и ответственным факторам» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Экономист» по критерию «План-факт анализ» выполняет только часть требований: выполняет типовые операции с подсказками; настройки, контроль или передача информации неполны. Индикатор «Отклонения разбиты по причинам и ответственным факторам» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Экономист» по критерию «План-факт анализ» обеспечивает стандарт: самостоятельно выполняет операцию по техкарте, контролирует параметры и фиксирует результат. Индикатор «Отклонения разбиты по причинам и ответственным факторам» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Экономист» по критерию «План-факт анализ» действует проактивно: предупреждает отклонения, согласует переналадку и сохраняет качество при изменении задания. Индикатор «Отклонения разбиты по причинам и ответственным факторам» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Экономист» по критерию «План-факт анализ» улучшает систему: снижает потери времени и материалов, подтверждая эффект улучшений данными смены. Индикатор «Отклонения разбиты по причинам и ответственным факторам» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Ресурсы и нормы": ["В должности «Экономист» по критерию «Ресурсы и нормы» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «Расход материалов и трудоёмкость сопоставлены с нормативами» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Экономист» по критерию «Ресурсы и нормы» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «Расход материалов и трудоёмкость сопоставлены с нормативами» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Экономист» по критерию «Ресурсы и нормы» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «Расход материалов и трудоёмкость сопоставлены с нормативами» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Экономист» по критерию «Ресурсы и нормы» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «Расход материалов и трудоёмкость сопоставлены с нормативами» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Экономист» по критерию «Ресурсы и нормы» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «Расход материалов и трудоёмкость сопоставлены с нормативами» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Экономический эффект": ["В должности «Экономист» по критерию «Экономический эффект» результат не соответствует требованию: теряет возможность или нарушает договорённость; следующий шаг и последствия не контролируются. Индикатор «Предложения содержат базу сравнения, допущения и расчёт результата» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Экономист» по критерию «Экономический эффект» выполняет только часть требований: обрабатывает отдельные запросы, но квалификация, сроки или фиксация договорённостей неполны. Индикатор «Предложения содержат базу сравнения, допущения и расчёт результата» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Экономист» по критерию «Экономический эффект» обеспечивает стандарт: самостоятельно ведёт задачу по согласованному процессу, фиксирует договорённости и следующий шаг. Индикатор «Предложения содержат базу сравнения, допущения и расчёт результата» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Экономист» по критерию «Экономический эффект» действует проактивно: заранее выявляет риск срыва, согласует решение с заинтересованными сторонами и удерживает результат. Индикатор «Предложения содержат базу сравнения, допущения и расчёт результата» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Экономист» по критерию «Экономический эффект» улучшает систему: повышает конверсию, удержание или предсказуемость за счёт анализа причин и воспроизводимых улучшений. Индикатор «Предложения содержат базу сравнения, допущения и расчёт результата» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Отчётность": ["В должности «Экономист» по критерию «Отчётность» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Таблицы сверены с источниками, выводы соответствуют цифрам» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Экономист» по критерию «Отчётность» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Таблицы сверены с источниками, выводы соответствуют цифрам» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Экономист» по критерию «Отчётность» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Таблицы сверены с источниками, выводы соответствуют цифрам» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Экономист» по критерию «Отчётность» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Таблицы сверены с источниками, выводы соответствуют цифрам» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Экономист» по критерию «Отчётность» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Таблицы сверены с источниками, выводы соответствуют цифрам» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]
},
"Руководитель юридического отдела": {
"Организация работы отдела": ["В должности «Руководитель юридического отдела» по критерию «Организация работы отдела» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «У каждой задачи есть ответственный, срок и критерий завершения» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Руководитель юридического отдела» по критерию «Организация работы отдела» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «У каждой задачи есть ответственный, срок и критерий завершения» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Руководитель юридического отдела» по критерию «Организация работы отдела» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «У каждой задачи есть ответственный, срок и критерий завершения» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Руководитель юридического отдела» по критерию «Организация работы отдела» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «У каждой задачи есть ответственный, срок и критерий завершения» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Руководитель юридического отдела» по критерию «Организация работы отдела» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «У каждой задачи есть ответственный, срок и критерий завершения» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Экспертиза договоров": ["В должности «Руководитель юридического отдела» по критерию «Экспертиза договоров» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Существенные финансовые, правовые и операционные риски обозначены до подписания» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Руководитель юридического отдела» по критерию «Экспертиза договоров» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Существенные финансовые, правовые и операционные риски обозначены до подписания» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Руководитель юридического отдела» по критерию «Экспертиза договоров» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Существенные финансовые, правовые и операционные риски обозначены до подписания» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Руководитель юридического отдела» по критерию «Экспертиза договоров» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Существенные финансовые, правовые и операционные риски обозначены до подписания» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Руководитель юридического отдела» по критерию «Экспертиза договоров» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Существенные финансовые, правовые и операционные риски обозначены до подписания» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Претензионная работа": ["В должности «Руководитель юридического отдела» по критерию «Претензионная работа» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «Позиция подтверждена документами, сроки ответа и процессуальные сроки соблюдены» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Руководитель юридического отдела» по критерию «Претензионная работа» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «Позиция подтверждена документами, сроки ответа и процессуальные сроки соблюдены» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Руководитель юридического отдела» по критерию «Претензионная работа» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «Позиция подтверждена документами, сроки ответа и процессуальные сроки соблюдены» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Руководитель юридического отдела» по критерию «Претензионная работа» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «Позиция подтверждена документами, сроки ответа и процессуальные сроки соблюдены» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Руководитель юридического отдела» по критерию «Претензионная работа» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «Позиция подтверждена документами, сроки ответа и процессуальные сроки соблюдены» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Правовые консультации": ["В должности «Руководитель юридического отдела» по критерию «Правовые консультации» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «Рекомендации содержат практический вывод и допустимые варианты действий» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Руководитель юридического отдела» по критерию «Правовые консультации» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «Рекомендации содержат практический вывод и допустимые варианты действий» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Руководитель юридического отдела» по критерию «Правовые консультации» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «Рекомендации содержат практический вывод и допустимые варианты действий» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Руководитель юридического отдела» по критерию «Правовые консультации» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «Рекомендации содержат практический вывод и допустимые варианты действий» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Руководитель юридического отдела» по критерию «Правовые консультации» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «Рекомендации содержат практический вывод и допустимые варианты действий» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Контроль правовых рисков": ["В должности «Руководитель юридического отдела» по критерию «Контроль правовых рисков» результат не соответствует требованию: не выявляет опасность или нарушение до возникновения последствий. Индикатор «Изменения законодательства и повторяющиеся риски доведены до затронутых подразделений» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Руководитель юридического отдела» по критерию «Контроль правовых рисков» выполняет только часть требований: замечает отдельные нарушения, но реагирует с задержкой или после напоминания. Индикатор «Изменения законодательства и повторяющиеся риски доведены до затронутых подразделений» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Руководитель юридического отдела» по критерию «Контроль правовых рисков» обеспечивает стандарт: проверяет установленные требования и своевременно сообщает об отклонениях. Индикатор «Изменения законодательства и повторяющиеся риски доведены до затронутых подразделений» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Руководитель юридического отдела» по критерию «Контроль правовых рисков» действует проактивно: предупреждает нарушение заранее и подтверждает устранение проверкой. Индикатор «Изменения законодательства и повторяющиеся риски доведены до затронутых подразделений» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Руководитель юридического отдела» по критерию «Контроль правовых рисков» улучшает систему: устраняет повторяющиеся причины нарушений и подтверждает устойчивость профилактики. Индикатор «Изменения законодательства и повторяющиеся риски доведены до затронутых подразделений» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]
