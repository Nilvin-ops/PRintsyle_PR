"Отходы": ["В должности «Уборщик производственных помещений» по критерию «Отходы» результат не соответствует требованию: не выполняет параметры задания или допускает остановку/брак без своевременной реакции. Индикатор «Отходы собраны и размещены в обозначенных местах, проходы не загромождены» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Уборщик производственных помещений» по критерию «Отходы» выполняет только часть требований: выполняет типовые операции с подсказками; настройки, контроль или передача информации неполны. Индикатор «Отходы собраны и размещены в обозначенных местах, проходы не загромождены» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Уборщик производственных помещений» по критерию «Отходы» обеспечивает стандарт: самостоятельно выполняет операцию по техкарте, контролирует параметры и фиксирует результат. Индикатор «Отходы собраны и размещены в обозначенных местах, проходы не загромождены» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Уборщик производственных помещений» по критерию «Отходы» действует проактивно: предупреждает отклонения, согласует переналадку и сохраняет качество при изменении задания. Индикатор «Отходы собраны и размещены в обозначенных местах, проходы не загромождены» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Уборщик производственных помещений» по критерию «Отходы» улучшает систему: снижает потери времени и материалов, подтверждая эффект улучшений данными смены. Индикатор «Отходы собраны и размещены в обозначенных местах, проходы не загромождены» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Расходные материалы": ["В должности «Уборщик производственных помещений» по критерию «Расходные материалы» результат не соответствует требованию: пропускает несоответствие или передаёт результат без необходимой проверки. Индикатор «Запасы моющих средств и инвентаря контролируются, нехватка сообщается заранее» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Уборщик производственных помещений» по критерию «Расходные материалы» выполняет только часть требований: проверяет основные параметры, но отдельные дефекты выявляются поздно или фиксируются неполно. Индикатор «Запасы моющих средств и инвентаря контролируются, нехватка сообщается заранее» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Уборщик производственных помещений» по критерию «Расходные материалы» обеспечивает стандарт: сверяет результат с требованиями, фиксирует отклонение и действует по установленному порядку. Индикатор «Запасы моющих средств и инвентаря контролируются, нехватка сообщается заранее» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Уборщик производственных помещений» по критерию «Расходные материалы» действует проактивно: локализует несоответствие до дальнейшей передачи и проверяет корректирующие действия. Индикатор «Запасы моющих средств и инвентаря контролируются, нехватка сообщается заранее» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Уборщик производственных помещений» по критерию «Расходные материалы» улучшает систему: анализирует повторяемость дефектов и внедряет проверяемые меры предупреждения. Индикатор «Запасы моющих средств и инвентаря контролируются, нехватка сообщается заранее» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

"Санузлы и общие зоны": ["В должности «Уборщик служебных помещений» по критерию «Санузлы и общие зоны» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «Поверхности обработаны, расходные материалы доступны пользователям» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Уборщик служебных помещений» по критерию «Санузлы и общие зоны» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «Поверхности обработаны, расходные материалы доступны пользователям» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Уборщик служебных помещений» по критерию «Санузлы и общие зоны» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «Поверхности обработаны, расходные материалы доступны пользователям» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Уборщик служебных помещений» по критерию «Санузлы и общие зоны» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «Поверхности обработаны, расходные материалы доступны пользователям» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Уборщик служебных помещений» по критерию «Санузлы и общие зоны» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «Поверхности обработаны, расходные материалы доступны пользователям» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Пополнение запасов": ["В должности «Уборщик служебных помещений» по критерию «Пополнение запасов» результат не соответствует требованию: допускает ошибку в количестве, идентификации, сохранности или документах без фиксации. Индикатор «Мыло, бумага и другие материалы пополняются до полного отсутствия» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Уборщик служебных помещений» по критерию «Пополнение запасов» выполняет только часть требований: выполняет основные операции, но записи или сверки требуют исправлений. Индикатор «Мыло, бумага и другие материалы пополняются до полного отсутствия» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Уборщик служебных помещений» по критерию «Пополнение запасов» обеспечивает стандарт: сверяет данные и фактический объект, своевременно отражает операцию и сообщает о расхождениях. Индикатор «Мыло, бумага и другие материалы пополняются до полного отсутствия» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Уборщик служебных помещений» по критерию «Пополнение запасов» действует проактивно: предупреждает дефицит, пересортицу или задержку до влияния на внутреннего заказчика. Индикатор «Мыло, бумага и другие материалы пополняются до полного отсутствия» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Уборщик служебных помещений» по критерию «Пополнение запасов» улучшает систему: уменьшает повторные ошибки и потери через анализ причин и улучшение порядка учёта. Индикатор «Мыло, бумага и другие материалы пополняются до полного отсутствия» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"Сохранность имущества": ["В должности «Уборщик служебных помещений» по критерию «Сохранность имущества» результат не соответствует требованию: пропускает обязательный этап или передаёт документ с критичными ошибками. Индикатор «Документы и личные вещи не перемещаются без необходимости, повреждения сообщаются» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Уборщик служебных помещений» по критерию «Сохранность имущества» выполняет только часть требований: оформляет типовые документы, но нуждается в перепроверке полноты или сроков. Индикатор «Документы и личные вещи не перемещаются без необходимости, повреждения сообщаются» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Уборщик служебных помещений» по критерию «Сохранность имущества» обеспечивает стандарт: самостоятельно готовит корректный комплект и соблюдает установленный срок процедуры. Индикатор «Документы и личные вещи не перемещаются без необходимости, повреждения сообщаются» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Уборщик служебных помещений» по критерию «Сохранность имущества» действует проактивно: заранее выявляет правовые/процедурные риски и согласует исправления до последствий. Индикатор «Документы и личные вещи не перемещаются без необходимости, повреждения сообщаются» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Уборщик служебных помещений» по критерию «Сохранность имущества» улучшает систему: предупреждает повторные ошибки через стандарты, контрольные точки и актуализацию шаблонов. Индикатор «Документы и личные вещи не перемещаются без необходимости, повреждения сообщаются» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],
"График и химия": ["В должности «Уборщик служебных помещений» по критерию «График и химия» результат не соответствует требованию: оставляет зону в неудовлетворительном или небезопасном состоянии. Индикатор «Работы выполнены вовремя, средства применяются по инструкции» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Уборщик служебных помещений» по критерию «График и химия» выполняет только часть требований: выполняет основную работу, но пропускает отдельные зоны, сроки или требования. Индикатор «Работы выполнены вовремя, средства применяются по инструкции» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Уборщик служебных помещений» по критерию «График и химия» обеспечивает стандарт: поддерживает установленное состояние зоны по графику и сообщает о неисправностях/нехватке. Индикатор «Работы выполнены вовремя, средства применяются по инструкции» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Уборщик служебных помещений» по критерию «График и химия» действует проактивно: заранее выявляет проблемы и организует устранение без срыва работы подразделения. Индикатор «Работы выполнены вовремя, средства применяются по инструкции» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Уборщик служебных помещений» по критерию «График и химия» улучшает систему: предлагает практичные изменения, снижающие повторные замечания и лишние затраты. Индикатор «Работы выполнены вовремя, средства применяются по инструкции» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."]

"Директор по развитию": {
"Возможности роста": ["В должности «Директор по развитию» по критерию «Возможности роста» результат не соответствует требованию: теряет возможность или нарушает договорённость; следующий шаг и последствия не контролируются. Индикатор «Инициативы подтверждены оценкой спроса, сегмента и потенциального результата» не подтверждён; требуется постоянное вмешательство руководителя.", "В должности «Директор по развитию» по критерию «Возможности роста» выполняет только часть требований: обрабатывает отдельные запросы, но квалификация, сроки или фиксация договорённостей неполны. Индикатор «Инициативы подтверждены оценкой спроса, сегмента и потенциального результата» подтверждается непоследовательно; необходимы подсказки и исправления.", "В должности «Директор по развитию» по критерию «Возможности роста» обеспечивает стандарт: самостоятельно ведёт задачу по согласованному процессу, фиксирует договорённости и следующий шаг. Индикатор «Инициативы подтверждены оценкой спроса, сегмента и потенциального результата» выполняется самостоятельно в типовых условиях, отклонения фиксируются.", "В должности «Директор по развитию» по критерию «Возможности роста» действует проактивно: заранее выявляет риск срыва, согласует решение с заинтересованными сторонами и удерживает результат. Индикатор «Инициативы подтверждены оценкой спроса, сегмента и потенциального результата» обеспечивается стабильно, риски и корректирующие действия доводятся до результата.", "В должности «Директор по развитию» по критерию «Возможности роста» улучшает систему: повышает конверсию, удержание или предсказуемость за счёт анализа причин и воспроизводимых улучшений. Индикатор «Инициативы подтверждены оценкой спроса, сегмента и потенциального результата» не только выполняется, но и становится устойчивее благодаря проверенным изменениям."],

<h2>${esc(c?c.n:"Кандидат")}</h2>

<div class="card"><h3>Рекомендация по кандидату</h3><span class="tag ${recCl(rec.k)}" style="font-size:15px;padding:3px 10px">${rec.t}</span>${recWhy(rec)}<p class="mut">Это подсказка для решения, а не решение. Итог принимает человек, опираясь на деловые качества кандидата. Баллы не диагностируют личность и не заменяют юридическую проверку основания отказа.</p></div>

function cset(){const tot=["h","p","t","m"].reduce((n,k)=>n+(+S.cw[k]||0),0);

<div class="card"><h3>Хранение данных кандидатов</h3><p class="mut">Данные хранятся только в этом браузере. Срок отсчитывается от даты согласия. По истечении срока карточку нужно удалить.</p><label>Срок хранения, месяцев<input type="number" min="1" max="60" value="${S.ret||12}" onchange="S.ret=Math.max(1,Math.min(60,+this.value||12));save();render()"></label><p>С истёкшим сроком: <b>${S.cands.filter(expired).length}</b></p><div class="row"><button class="ghost danger" onclick="purgeExpired()">Удалить кандидатов с истёкшим сроком</button><button class="ghost danger" onclick="clearDemo()">Удалить демо-данные</button></div><p class="mut">Резервную копию делайте в разделе «Настройки»: файл копии содержит персональные данные кандидатов.</p></div>
<div class="card"><h3>Что делает и чего не делает методика</h3><p>В основе: структурированное интервью (одни вопросы и критерии для всех) и практическое задание. Такие методы в исследованиях предсказывают успех в работе лучше свободной беседы и интуиции.</p><p><b>Чего здесь нет намеренно:</b> типирования личности (MBTI и подобного), «чтения» по лицу или голосу, оценки по соцсетям. Эти подходы не подтверждены как основание для найма. Если нужен психометрический тест, используйте валидированный инструмент через квалифицированного психолога и вносите вывод в комментарии к критериям.</p></div>
